<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #04040a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1200px;
        }

        /* Ambient Canvas Background */
        canvas#bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Floating Edu Emoji Particles Container */
        #particleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .edu-item {
            position: absolute;
            font-size: 1.8rem;
            will-change: transform, opacity;
            pointer-events: none;
            animation: eduFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes eduFly {
            0% {
                transform: translate(0, 0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot));
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        /* Multi-color Animated Title */
        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            
            /* Animated Multi-Color Gradient Text */
            background: linear-gradient(
                90deg, 
                #ff007f, 
                #a855f7, 
                #3b82f6, 
                #00f2fe, 
                #4facfe, 
                #ff007f
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;

            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.5));
            cursor: pointer;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Double Spin (720deg) + High Jump */
        .double-spin {
            animation: doubleSpinAnim 1.1s cubic-bezier(0.25, 1, 0.3, 1) forwards;
        }

        @keyframes doubleSpinAnim {
            0% {
                transform: translateY(0) rotateY(0deg) scale(1);
            }
            45% {
                transform: translateY(-65px) rotateY(360deg) scale(1.25);
            }
            85% {
                transform: translateY(8px) rotateY(720deg) scale(0.95);
            }
            100% {
                transform: translateY(0) rotateY(720deg) scale(1);
            }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .box {
            background: rgba(15, 14, 32, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .box:hover {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
        }

        .card-bounce {
            animation: cardPopAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPopAnim {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .number {
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #a78bfa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div id="particleContainer"></div>

    <div class="container">
        <h1 id="mainTitle" onclick="triggerTitleEffect()">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer Engine
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        // Voice "Ta-Daaa!" using Web Speech API + Musical Flourish
        function playTadaSound() {
            initAudio();

            // 1. Cute Voice "Ta-Daaa!"
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop active speech
                const utterance = new SpeechSynthesisUtterance("Ta Daaa!");
                utterance.pitch = 1.8; // Cute high pitch
                utterance.rate = 1.15;  // Energetic speed
                utterance.volume = 1.0;

                // Select female/cute voice if available
                const voices = window.speechSynthesis.getVoices();
                const cuteVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Victoria')));
                if (cuteVoice) utterance.voice = cuteVoice;

                window.speechSynthesis.speak(utterance);
            }

            // 2. Brass Fanfare Musical Accord
            if (audioCtx) {
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 chord

                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (index * 0.05));

                    gain.gain.setValueAtTime(0.01, now);
                    gain.gain.linearRampToValueAtTime(0.15, now + (index * 0.05) + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + (index * 0.05));
                    osc.stop(now + 0.8);
                });
            }
        }

        // Card Pop Sound
        function playPopSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            const now = audioCtx.currentTime;

            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);

            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.1);
        }

        // Burst Education Items (📚, 🎓, ✏️, etc.)
        function burstEduItems(centerX, centerY) {
            const container = document.getElementById('particleContainer');
            const eduIcons = ['📚', '🎓', '✏️', '💡', '📐', '🧪', '📖', '✨', '📝', '🧠'];
            const count = 14;

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'edu-item';
                el.innerText = eduIcons[Math.floor(Math.random() * eduIcons.length)];

                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5);
                const distance = Math.random() * 120 + 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 40;
                const rot = (Math.random() - 0.5) * 360;

                el.style.left = `${centerX}px`;
                el.style.top = `${centerY}px`;
                el.style.setProperty('--tx', `${tx}px`);
                el.style.setProperty('--ty', `${ty}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                container.appendChild(el);

                setTimeout(() => el.remove(), 1200);
            }
        }

        // Title Double Spin & Landing Burst Handler
        function triggerTitleEffect() {
            const title = document.getElementById('mainTitle');
            if (title.classList.contains('double-spin')) return;

            playTadaSound();
            title.classList.add('double-spin');

            const rect = title.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            setTimeout(() => {
                burstEduItems(centerX, centerY);
            }, 850);

            setTimeout(() => {
                title.classList.remove('double-spin');
            }, 1100);
        }

        // Card Click Handler
        function triggerCardEffect(e) {
            e.stopPropagation();
            const card = e.currentTarget;

            playPopSound();

            card.classList.remove('card-bounce');
            void card.offsetWidth;
            card.classList.add('card-bounce');
        }

        // Countdown Logic
        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Subtle Ambient Canvas Animation
        const bgCanvas = document.getElementById('bgCanvas');
        const ctx = bgCanvas.getContext('2d');
        let bgParticles = [];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgParticles = [];
            const count = Math.min(Math.floor((bgCanvas.width * bgCanvas.height) / 12000), 40);
            for (let i = 0; i < count; i++) {
                bgParticles.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    radius: Math.random() * 2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.4 + 0.1
                });
            }
        }

        function animateBg() {
            ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            const grad = ctx.createRadialGradient(
                bgCanvas.width / 2, bgCanvas.height / 2, 50,
                bgCanvas.width / 2, bgCanvas.height / 2, bgCanvas.width * 0.7
            );
            grad.addColorStop(0, 'rgba(139, 92, 246, 0.08)');
            grad.addColorStop(1, 'rgba(4, 4, 10, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = '#8b5cf6';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(animateBg);
        }

        // Preload speech synthesis voices
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        window.addEventListener('resize', resizeBg);
        resizeBg();
        animateBg();
    </script>
</body>
</html>
