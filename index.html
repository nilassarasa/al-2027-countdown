<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Fixed Unmute Button at Bottom Right Corner */
        .audio-wrapper {
            position: fixed !important;
            bottom: 25px !important;
            right: 25px !important;
            z-index: 999999 !important;
            width: 130px;
            height: 42px;
            border-radius: 30px;
            padding: 3px;
            background: conic-gradient(from 0deg, #00f0ff, #d946ef, #ff007f, #00f0ff);
            animation: spinRing 1s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            cursor: pointer;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .audio-control {
            width: 100%;
            height: 100%;
            background: #0d0c1c;
            border: none;
            color: #00f0ff;
            border-radius: 27px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            animation: unspinText 1s linear infinite;
        }

        @keyframes unspinText {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: fullTitleGlitchShake 3s ease-in-out infinite;
        }

        .title-line.title-spin-jump {
            animation: titleDoubleSpinJump 0.4s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        @keyframes titleDoubleSpinJump {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            50% { transform: translateY(-40px) rotateY(360deg) scale(1.2); filter: drop-shadow(0 0 20px #00f0ff) drop-shadow(0 0 35px #d946ef); }
            100% { transform: translateY(0) rotateY(720deg) scale(1); }
        }

        .title-line .space {
            width: 0.4em;
        }

        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 3s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
            }
            8% {
                transform: translateY(-16px) scale(1.15);
                color: #00f0ff;
                text-shadow: 0 0 12px #00f0ff, 0 0 24px #00f0ff;
            }
            16% {
                transform: translateY(-5px) scale(1.08);
                color: #d946ef;
                text-shadow: 0 0 14px #d946ef, 0 0 28px #d946ef;
            }
            24%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 70% { transform: translate(0, 0) skewX(0deg); filter: none; }
            72% { transform: translate(-5px, 1px) skewX(-3deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #d946ef); }
            75% { transform: translate(5px, -1px) skewX(3deg); filter: drop-shadow(4px 0 #d946ef) drop-shadow(-4px 0 #00f0ff); }
            78%, 100% { transform: translate(0, 0) skewX(0deg); filter: none; }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown { grid-template-columns: repeat(2, 1fr); }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #d946ef, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 2s linear infinite;
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <!-- UNMUTE BUTTON -->
    <div class="audio-wrapper" id="audioWrapper" onclick="toggleAudio()">
        <button class="audio-control" id="audioBtn">🔇 Unmute</button>
    </div>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <div class="title-line" id="titleLine" onclick="triggerTitleAction(event)">2027 A/L COUNTDOWN</div>

        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quoteDisplay"></div>
        </div>
    </div>

    <script>
        const titleEl = document.getElementById('titleLine');
        const titleText = titleEl.textContent;
        titleEl.textContent = '';

        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.04}s`);
            }
            titleEl.appendChild(span);
        });

        // Online Audio source fallback thiyena audio setup එක
        const bgAudio = new Audio("https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3");
        bgAudio.loop = true;
        bgAudio.volume = 0.5;

        let isPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = "🔊 Playing";
                }).catch(err => {
                    console.log("Audio Error: ", err);
                    alert("Audio file failed to load! Click screen and try again.");
                });
            } else {
                bgAudio.pause();
                isPlaying = false;
                btn.innerHTML = "🔇 Unmute";
            }
        }

        function triggerTitleAction(e) {
            e.stopPropagation();
            titleEl.classList.remove('title-spin-jump');
            void titleEl.offsetWidth;
            titleEl.classList.add('title-spin-jump');
            setTimeout(() => titleEl.classList.remove('title-spin-jump'), 400);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
        }

        const quotes = [
            "~ Time is an illusion ~ ⏳ ✨",
            "~ Lost time is never found again ~ ⌛",
            "~ The problem is, you think you have time ~ 👁️",
            "~ Realize that now, in this moment, time stops for nothing ~ 🏃 ✨"
        ];

        let currentQuoteIndex = 0;
        const quoteDisplay = document.getElementById('quoteDisplay');
        quoteDisplay.textContent = quotes[currentQuoteIndex];

        setInterval(() => {
            currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
            quoteDisplay.textContent = quotes[currentQuoteIndex];
        }, 3000);

        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Stars Setup
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
        }

        function animate() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';

            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>
</body>
</html>
