<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Fullscreen Canvas for 3D Flying Stars & Nebulae */
        canvas#spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Particle Container for Click Bursts */
        #particleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            will-change: transform, opacity;
            pointer-events: none;
            animation: particleFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        /* Title Styling */
        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, #ff007f, #a855f7, #3b82f6, #00f2fe, #4facfe, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.8));
            cursor: pointer;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .double-spin {
            animation: doubleSpinAnim 1.1s cubic-bezier(0.25, 1, 0.3, 1) forwards;
        }

        @keyframes doubleSpinAnim {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            45% { transform: translateY(-65px) rotateY(360deg) scale(1.25); }
            85% { transform: translateY(8px) rotateY(720deg) scale(0.95); }
            100% { transform: translateY(0) rotateY(720deg) scale(1); }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .box {
            background: rgba(6, 8, 24, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .box:hover {
            border-color: rgba(139, 92, 246, 0.8);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        }

        .card-bounce {
            animation: cardPopAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPopAnim {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .number {
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #a78bfa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>
    <div id="particleContainer"></div>

    <div class="container">
        <h1 id="mainTitle" onclick="triggerTitleEffect()">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <audio id="tadaSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playTadaSound() {
            const sound = document.getElementById('tadaSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log(e));
            }
        }

        function playPopSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function burstParticles(centerX, centerY, icons) {
            const container = document.getElementById('particleContainer');
            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.innerText = icons[Math.floor(Math.random() * icons.length)];
                const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5);
                const distance = Math.random() * 110 + 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 20;
                const rot = (Math.random() - 0.5) * 360;

                el.style.left = `${centerX}px`;
                el.style.top = `${centerY}px`;
                el.style.setProperty('--tx', `${tx}px`);
                el.style.setProperty('--ty', `${ty}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                container.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            }
        }

        function triggerTitleEffect() {
            const title = document.getElementById('mainTitle');
            if (title.classList.contains('double-spin')) return;
            playTadaSound();
            title.classList.add('double-spin');
            const rect = title.getBoundingClientRect();
            burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ['📚', '🎓', '✏️', '💡', '📐', '🧪', '📖', '✨']);
            setTimeout(() => title.classList.remove('double-spin'), 1100);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            const card = e.currentTarget;
            playPopSound();
            card.classList.remove('card-bounce');
            void card.offsetWidth;
            card.classList.add('card-bounce');
        }

        // Countdown Timer
        const examDate = new Date("August 3, 2027 08:30:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Real 3D Flying Stars (Warp Engine)
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numStars = 600;
        const stars = [];
        const speed = 2.5;

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = initial ? Math.random() * width : width;
                this.pz = this.z;
                
                // Color variations: cyan, purple, white, blue
                const colors = ['#ffffff', '#a78bfa', '#00f2fe', '#3b82f6', '#ff007f'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.pz = this.z;
                this.z -= speed;

                if (this.z <= 0) {
                    this.reset();
                }
            }

            draw() {
                // Project 3D coordinates to 2D screen surface
                const sx = (this.x / this.z) * (width / 2) + width / 2;
                const sy = (this.y / this.z) * (height / 2) + height / 2;

                const px = (this.x / this.pz) * (width / 2) + width / 2;
                const py = (this.y / this.pz) * (height / 2) + height / 2;

                if (sx < 0 || sx > width || sy < 0 || sy > height) return;

                const size = (1 - this.z / width) * 3;
                const alpha = Math.min(1, (1 - this.z / width) * 1.5);

                ctx.save();
                ctx.strokeStyle = this.color;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = size;

                // Motion streak coming from distance
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();

                // Glowing star head
                ctx.beginPath();
                ctx.arc(sx, sy, size * 0.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        function renderSpace() {
            // Soft trail effect for deep space field
            ctx.fillStyle = 'rgba(2, 3, 12, 0.35)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }

            requestAnimationFrame(renderSpace);
        }

        renderSpace();
    </script>
</body>
</html>
