<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Allows clicks to pass through to buttons/cards */
        }

        /* Top-Left Circular Logo Link with Neon Glow Pulse */
        .profile-logo-link {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #00f0ff;
            box-shadow: 
                0 0 10px #00f0ff,
                0 0 20px #00f0ff,
                0 0 35px rgba(0, 240, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            animation: logoGlowPulse 2.5s infinite ease-in-out;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            cursor: pointer;
        }

        @keyframes logoGlowPulse {
            0%, 100% {
                border-color: #00f0ff;
                box-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #00f0ff,
                    0 0 40px rgba(0, 240, 255, 0.7);
            }
            50% {
                border-color: #ff007f;
                box-shadow: 
                    0 0 16px #ff007f,
                    0 0 32px #ff007f,
                    0 0 50px rgba(255, 0, 127, 0.8);
            }
        }

        .profile-logo-link:hover {
            transform: scale(1.12);
            animation-play-state: paused;
            border-color: #00ffaa;
            box-shadow: 0 0 25px #00ffaa, 0 0 45px #00ffaa;
        }

        .profile-logo-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Running Border Sound Button */
        .audio-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: 175px;
            height: 48px;
            border-radius: 30px;
            isolation: isolate;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .audio-wrapper .border-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .audio-wrapper rect.border-path {
            fill: none;
            stroke-width: 3;
            rx: 24px;
            ry: 24px;
            stroke-dasharray: 80 320;
            animation: runAround 1.8s linear infinite;
        }

        .audio-wrapper.muted {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        .audio-wrapper.muted rect.border-path {
            stroke: url(#pinkCyanGradient);
            filter: drop-shadow(0 0 4px #ff007f) drop-shadow(0 0 8px #00f0ff);
        }

        .audio-wrapper.unmuted {
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .audio-wrapper.unmuted rect.border-path {
            stroke: url(#greenCyanGradient);
            filter: drop-shadow(0 0 4px #00ffaa) drop-shadow(0 0 8px #00f0ff);
            animation: runAround 2.6s linear infinite;
        }

        .audio-control {
            position: relative;
            z-index: 2;
            background: #0d0c1c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @keyframes runAround {
            0% { stroke-dashoffset: 400; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Container */
        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            animation: fullTitleGlitchShake 8s ease-in-out infinite;
        }

        .title-line .space {
            width: 0.4em;
        }

        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 8s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
            8% {
                transform: translateY(-22px) scale(1.15);
                color: #00f0ff;
                text-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #ff007f,
                    0 0 36px #a855f7;
            }
            16%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 60% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
            61% {
                transform: translate(-8px, 1px) skewX(-4deg);
                filter: drop-shadow(-5px 0 #00f0ff) drop-shadow(5px 0 #ff007f);
            }
            63% {
                transform: translate(8px, -2px) skewX(5deg);
                filter: drop-shadow(6px 0 #a855f7) drop-shadow(-6px 0 #00f0ff);
            }
            65% {
                transform: translate(-4px, 1px) skewX(-2deg);
                filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff);
            }
            67% {
                transform: translate(5px, -1px) skewX(3deg);
                filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7);
            }
            69% {
                transform: translate(-6px, 2px) skewX(-3deg);
                filter: drop-shadow(-5px 0 #ff007f) drop-shadow(3px 0 #00f0ff);
            }
            71% {
                transform: translate(3px, -1px) skewX(1deg);
                filter: drop-shadow(3px 0 #00f0ff);
            }
            73%, 100% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
        }

        /* Countdown Grid */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
            .profile-logo-link {
                top: 16px;
                left: 16px;
                width: 52px;
                height: 52px;
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Quotes Container */
        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }
            80% { opacity: 0.9; transform: translate(-2px, 1px) skewX(5deg); }
            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }
    </style>
</head>
<body>

    <!-- Glowing Top-Left Circular Logo -->
    <a href="[https://www.youtube.com/@CryoneX_Space](https://www.youtube.com/@CryoneX_Space)" target="_blank" class="profile-logo-link" title="Visit CryoneX Space YouTube Channel">
        <img src="channels4_profile.jpg" alt="CryoneX Space">
    </a>

    <!-- Audio Control Button -->
    <div class="audio-wrapper muted" id="audioWrapper">
        <svg class="border-svg" width="100%" height="100%">
            <defs>
                <linearGradient id="pinkCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff007f" />
                    <stop offset="50%" stop-color="#00f0ff" />
                    <stop offset="100%" stop-color="#ff007f" />
                </linearGradient>
                <linearGradient id="greenCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00ffaa" />
                    <stop offset="50%" stop-color="#00f0ff" />
                    <stop offset="100%" stop-color="#00ffaa" />
                </linearGradient>
            </defs>
            <rect class="border-path" x="1.5" y="1.5" width="172" height="45" />
        </svg>

        <button class="audio-control" id="audioBtn" onclick="toggleAudio()">🔇 Sound OFF</button>
    </div>

    <!-- Starfield Particle Canvas -->
    <canvas id="starfieldCanvas"></canvas>

    <!-- Main Content -->
    <div class="container">
        <div class="title-line" id="titleLine" onclick="triggerTitleAction(event)">2027 A/L COUNTDOWN</div>

        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quoteDisplay"></div>
        </div>
    </div>

    <script>
        // Setup Title Wave Animation
        const titleEl = document.getElementById('titleLine');
        const titleText = titleEl.textContent;
        titleEl.textContent = '';

        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.08}s`);
            }
            titleEl.appendChild(span);
        });

        // Audio System
        const bgPlaylist = [
            "YTDown.com_YouTube_No-Copyright-Groove-Day-Hip-Hop-Beat-Gro_Media_7sUZbh_3m0Q_007_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-KONOSOO-No-Copyright-Thanks-NNX_Media_MOsQFsa6ZzI_005_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-HEMENESY-No-Copyright_Media_1fVQrSZV31k_005_48k.m4a",
            "YTDown.com_YouTube_FULL-BASS-REMIX-Linkin-Park-In-The-End-N_Media_8YoHeuN0v0k_004_48k(1).m4a"
        ];

        let currentTrackIndex = Math.floor(Math.random() * bgPlaylist.length);
        const bgAudio = new Audio();
        bgAudio.volume = 0.08;

        function loadTrack(index) {
            bgAudio.src = bgPlaylist[index];
            bgAudio.load();
        }

        bgAudio.addEventListener('ended', () => {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * bgPlaylist.length);
            } while (nextIndex === currentTrackIndex && bgPlaylist.length > 1);
            currentTrackIndex = nextIndex;
            loadTrack(currentTrackIndex);
            bgAudio.play();
        });

        loadTrack(currentTrackIndex);

        const soundBg = new Audio("bg.mp3");
        const soundClick = new Audio("click.mp3");
        const soundTitle = new Audio("title.mp3");

        soundBg.volume = 0.05;
        soundClick.volume = 0.05;
        soundTitle.volume = 0.05;

        function playFx(audioObj) {
            audioObj.currentTime = 0;
            audioObj.play().catch(() => {});
        }

        let isPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const wrapper = document.getElementById('audioWrapper');
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = "🔊 Sound ON";
                    wrapper.classList.remove('muted');
                    wrapper.classList.add('unmuted');
                }).catch(err => console.log("Audio playback blocked:", err));
            } else {
                bgAudio.pause();
                isPlaying = false;
                btn.innerHTML = "🔇 Sound OFF";
                wrapper.classList.remove('unmuted');
                wrapper.classList.add('muted');
            }
        }

        function triggerTitleAction(e) {
            e.stopPropagation();
            playFx(soundTitle);

            const rect = titleEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            spawnInteraction(centerX, centerY);
            spawnEduItems(centerX, centerY);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            playFx(soundClick);

            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('#audioWrapper') || e.target.closest('.profile-logo-link')) return;
            playFx(soundBg);
            spawnInteraction(e.clientX, e.clientY);
        });

        // Quotes List
        const quotes = [
            "~ Time is an illusion ⏳ ✨ 🌌 ~",
            "~ Lost time is never found again ⌛ 🪙 🔑 ~",
            "~ The problem is, you think you have time 👁️ 🍃 ~",
            "~ Time moves in one direction, memory in another 🧠 🕯️ ~",
            "~ Time is the most valuable thing a man can spend 💎 ⚖️ ~",
            "~ Time flies over us, but leaves its shadow behind 🕊️ ⛅ ~",
            "~ Time is a storm in which we are all lost ⛈️ 🌪️ ~",
            "~ How did it get so late so soon? 🌙 🦉 ~",
            "~ The way we spend our time defines who we are ⏳ 🧭 ~",
            "~ Past, Present, Future—all collide in this moment 💫 ⚡ ~",
            "~ Chase the dream, not the clock 🏃 🌌 ~"
        ];

        let quoteIndex = 0;
        const quoteEl = document.getElementById('quoteDisplay');

        function updateQuote() {
            quoteEl.classList.remove('glitch-in');
            quoteEl.classList.add('glitch-out');

            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % quotes.length;
                quoteEl.textContent = quotes[quoteIndex];
                quoteEl.classList.remove('glitch-out');
                quoteEl.classList.add('glitch-in');
            }, 400);
        }

        quoteEl.textContent = quotes[0];
        quoteEl.classList.add('glitch-in');
        setInterval(updateQuote, 7000);

        // Starfield Canvas Setup
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let stars = [];
        const starCount = 130;

        class Star {
            constructor() { this.reset(); }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.color = ['#00f0ff', '#ff007f', '#a855f7', '#ffffff'][Math.floor(Math.random() * 4)];
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        let particles = [];
        class BurstParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.color = ['#00f0ff', '#ff007f', '#a855f7', '#00ffaa'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let shockwaves = [];
        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 2;
                this.maxRadius = 70 + Math.random() * 30;
                this.alpha = 1;
                this.color = ['#00f0ff', '#ff007f', '#a855f7'][Math.floor(Math.random() * 3)];
            }

            update() {
                this.radius += 4;
                this.alpha = 1 - (this.radius / this.maxRadius);
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        let eduItems = [];
        const eduSymbols = ['📚', '✏️', '📐', '🔬', '🎓', '📝', '🧪', '💡', '📖', '💻'];

        class EduItem {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.symbol = eduSymbols[Math.floor(Math.random() * eduSymbols.length)];
                this.size = Math.random() * 16 + 18;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 1.5;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.008;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `${this.size}px sans-serif`;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        function spawnInteraction(x, y) {
            shockwaves.push(new Shockwave(x, y));
            for (let i = 0; i < 20; i++) {
                particles.push(new BurstParticle(x, y));
            }
        }

        function spawnEduItems(x, y) {
            for (let i = 0; i < 15; i++) {
                eduItems.push(new EduItem(x, y));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                shockwaves[i].update();
                shockwaves[i].draw();
                if (shockwaves[i].alpha <= 0 || shockwaves[i].radius >= shockwaves[i].maxRadius) {
                    shockwaves.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            for (let i = eduItems.length - 1; i >= 0; i--) {
                eduItems[i].update();
                eduItems[i].draw();
                if (eduItems[i].alpha <= 0) {
                    eduItems.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }
        animate();

        // Target Date Logic (August 1, 2027)
        const targetDate = new Date("2027-08-01T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = "00";
                document.getElementById('hours').textContent = "00";
                document.getElementById('minutes').textContent = "00";
                document.getElementById('seconds').textContent = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
