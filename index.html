        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Left Circular Profile Logo */
        .top-left-profile {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: block;
            text-decoration: none;
            transition: transform 0.3s ease;
            perspective: 800px;
        }

        .top-left-profile img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            animation: pinkPulse 2s infinite ease-in-out, singleFlipPause 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            transform-style: preserve-3d;
        }

        .top-left-profile:hover {
            transform: scale(1.15);
        }

        @keyframes singleFlipPause {
            0% { transform: rotateY(0deg); }
            30% { transform: rotateY(360deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes pinkPulse {
            0%, 100% { box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f; }
            50% { box-shadow: 0 0 25px #ff007f, 0 0 50px #ff007f; }
        }

        /* Audio Wrapper */
        .audio-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: 175px;
            height: 48px;
            border-radius: 30px;
            isolation: isolate;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .audio-wrapper .border-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .audio-wrapper rect.border-path {
            fill: none;
            stroke-width: 3;
            rx: 24px;
            ry: 24px;
            stroke-dasharray: 80 320;
            animation: runAround 1.8s linear infinite;
        }

        .audio-wrapper.muted {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        .audio-wrapper.muted rect.border-path {
            stroke: url(#pinkCyanGradient);
            filter: drop-shadow(0 0 4px #ff007f) drop-shadow(0 0 8px #00f0ff);
        }

        .audio-wrapper.unmuted {
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .audio-wrapper.unmuted rect.border-path {
            stroke: url(#greenCyanGradient);
            filter: drop-shadow(0 0 4px #00ffaa) drop-shadow(0 0 8px #00f0ff);
            animation: runAround 2.6s linear infinite;
        }

        .audio-control {
            position: relative;
            z-index: 2;
            background: #0d0c1c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            will-change: transform;
        }

        @keyframes runAround {
            0% { stroke-dashoffset: 400; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 20px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-wrapper {
            width: 100%;
            margin-bottom: 30px;
        }

        /* Title Line with Running Glitch Shake & Letter Wave Jump */
        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            cursor: default;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            animation: fullTitleGlitchShake 8s ease-in-out infinite;
            will-change: transform;
        }

        .title-line .space {
            width: 0.4em;
        }

        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 8s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
            8% {
                transform: translateY(-22px) scale(1.15);
                color: #00f0ff;
                text-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #ff007f,
                    0 0 36px #a855f7;
            }
            16%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 60% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
            61% {
                transform: translate(-8px, 1px) skewX(-4deg);
                filter: drop-shadow(-5px 0 #00f0ff) drop-shadow(5px 0 #ff007f);
            }
            63% {
                transform: translate(8px, -2px) skewX(5deg);
                filter: drop-shadow(6px 0 #a855f7) drop-shadow(-6px 0 #00f0ff);
            }
            65% {
                transform: translate(-4px, 1px) skewX(-2deg);
                filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff);
            }
            67% {
                transform: translate(5px, -1px) skewX(3deg);
                filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7);
            }
            69% {
                transform: translate(-6px, 2px) skewX(-3deg);
                filter: drop-shadow(-5px 0 #ff007f) drop-shadow(3px 0 #00f0ff);
            }
            71% {
                transform: translate(3px, -1px) skewX(1deg);
                filter: drop-shadow(3px 0 #00f0ff);
            }
            73%, 100% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {

            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }

            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }

        /* Hidden YouTube Container */
        #youtube-player-container {
            display: none;
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }
    </style>

        const titleEl = document.getElementById('titleLine');

        let player;
        let isPlaying = false;
        let ytReady = false;
        let currentTrackIndex = -1;

        function getRandomTrackIndex() {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * ytPlaylist.length);
            } while (nextIndex === currentTrackIndex && ytPlaylist.length > 1);
            return nextIndex;
        }

        /* YouTube Iframe API Initialization */
        function onYouTubeIframeAPIReady() {
            currentTrackIndex = getRandomTrackIndex();
            player = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: ytPlaylist[currentTrackIndex],
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            ytReady = true;
            player.setVolume(20); // Adjust volume level (0-100)
        }

        function onPlayerStateChange(event) {
            // When video ends, play a new random song
            if (event.data === YT.PlayerState.ENDED && isPlaying) {
                playRandomNextTrack();
            }
        }

        function playRandomNextTrack() {
            currentTrackIndex = getRandomTrackIndex();
            if (player && ytReady) {
                player.loadVideoById(ytPlaylist[currentTrackIndex]);
                player.playVideo();
            }
        }

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const wrapper = document.getElementById('audioWrapper');
            
            if (!isPlaying) {
                if (ytReady && player) {
                    player.playVideo();
                    isPlaying = true;
                    btn.innerHTML = "🔊 Sound ON";
                    wrapper.classList.remove('muted');
                    wrapper.classList.add('unmuted');
                }
            } else {
                if (ytReady && player) {
                    player.pauseVideo();
                    isPlaying = false;
                    btn.innerHTML = "🔇 Sound OFF";
                    wrapper.classList.remove('unmuted');
                    wrapper.classList.add('muted');

            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Left Circular Profile Logo */
        .top-left-profile {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: block;
            text-decoration: none;
            transition: transform 0.3s ease;
            perspective: 800px;
        }

        .top-left-profile img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            animation: pinkPulse 2s infinite ease-in-out, singleFlipPause 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            transform-style: preserve-3d;
        }

        .top-left-profile:hover {
            transform: scale(1.15);
        }

        @keyframes singleFlipPause {
            0% { transform: rotateY(0deg); }
            30% { transform: rotateY(360deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes pinkPulse {
            0%, 100% { box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f; }
            50% { box-shadow: 0 0 25px #ff007f, 0 0 50px #ff007f; }
        }

        /* Audio Wrapper */
        .audio-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: 175px;
            height: 48px;
            border-radius: 30px;
            isolation: isolate;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .audio-wrapper .border-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .audio-wrapper rect.border-path {
            fill: none;
            stroke-width: 3;
            rx: 24px;
            ry: 24px;
            stroke-dasharray: 80 320;
            animation: runAround 1.8s linear infinite;
        }

        .audio-wrapper.muted {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        .audio-wrapper.muted rect.border-path {
            stroke: url(#pinkCyanGradient);
            filter: drop-shadow(0 0 4px #ff007f) drop-shadow(0 0 8px #00f0ff);
        }

        .audio-wrapper.unmuted {
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .audio-wrapper.unmuted rect.border-path {
            stroke: url(#greenCyanGradient);
            filter: drop-shadow(0 0 4px #00ffaa) drop-shadow(0 0 8px #00f0ff);
            animation: runAround 2.6s linear infinite;
        }

        .audio-control {
            position: relative;
            z-index: 2;
            background: #0d0c1c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            will-change: transform;
        }

        @keyframes runAround {
            0% { stroke-dashoffset: 400; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 20px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-wrapper {
            width: 100%;
            margin-bottom: 30px;
        }

        /* Title Line with Running Glitch Shake & Letter Wave Jump */
        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            cursor: default;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            animation: fullTitleGlitchShake 8s ease-in-out infinite;
            will-change: transform;
        }

        .title-line .space {
            width: 0.4em;
        }

        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 8s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
            8% {
                transform: translateY(-22px) scale(1.15);
                color: #00f0ff;
                text-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #ff007f,
                    0 0 36px #a855f7;
            }
            16%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 60% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
            61% {
                transform: translate(-8px, 1px) skewX(-4deg);
                filter: drop-shadow(-5px 0 #00f0ff) drop-shadow(5px 0 #ff007f);
            }
            63% {
                transform: translate(8px, -2px) skewX(5deg);
                filter: drop-shadow(6px 0 #a855f7) drop-shadow(-6px 0 #00f0ff);
            }
            65% {
                transform: translate(-4px, 1px) skewX(-2deg);
                filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff);
            }
            67% {
                transform: translate(5px, -1px) skewX(3deg);
                filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7);
            }
            69% {
                transform: translate(-6px, 2px) skewX(-3deg);
                filter: drop-shadow(-5px 0 #ff007f) drop-shadow(3px 0 #00f0ff);
            }
            71% {
                transform: translate(3px, -1px) skewX(1deg);
                filter: drop-shadow(3px 0 #00f0ff);
            }
            73%, 100% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }
            80% { opacity: 0.9; transform: translate(-2px, 1px) skewX(5deg); }
            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }

        /* Completely Hidden YouTube Container */
        #youtube-player-container {
            display: none;
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <a href="[https://www.youtube.com/@CryoneX_Space](https://www.youtube.com/@CryoneX_Space)" target="_blank" rel="noopener noreferrer" class="top-left-profile">
        <img src="channels4_profile.jpg" alt="CryoneX Space YouTube Channel">
    </a>

    <div class="audio-wrapper muted" id="audioWrapper">
        <svg class="border-svg" width="100%" height="100%">
            <defs>
                <linearGradient id="pinkCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff007f" />
                    <stop offset="50%" stop-color="#00f0ff" />
                    <stop offset="100%" stop-color="#ff007f" />
                </linearGradient>
                <linearGradient id="greenCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00ffaa" />
                    <stop offset="50%" stop-color="#00f0ff" />
                    <stop offset="100%" stop-color="#00ffaa" />
                </linearGradient>
            </defs>
            <rect class="border-path" x="1.5" y="1.5" width="172" height="45" />
        </svg>

        <button class="audio-control" id="audioBtn" onclick="toggleAudio()">🔇 Sound OFF</button>
    </div>

    <!-- Hidden YouTube Player Div -->
    <div id="youtube-player-container">
        <div id="yt-player"></div>
    </div>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <div class="title-wrapper">
            <div class="title-line" id="titleLine">2027 A/L COUNTDOWN</div>
        </div>

        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quoteDisplay"></div>
        </div>
    </div>

    <!-- YouTube Iframe API Script -->
    <script src="[https://www.youtube.com/iframe_api](https://www.youtube.com/iframe_api)"></script>

    <script>
        /* Title animation script */
        const titleEl = document.getElementById('titleLine');
        const titleText = titleEl.textContent;
        titleEl.textContent = '';

        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.08}s`);
            }
            titleEl.appendChild(span);
        });

        /* YouTube Music Array */
        const ytPlaylist = [
            "3gb0Zg3p3Lk",
            "UP8x9QbTVno",
            "qYwYw6mLlPs",
            "_gzm2gRcYms",
            "VtthkQ7mLFk",
            "oSHzUD-uqKY",
            "-l-EvwhSWQU",
            "7sUZbh_3m0Q",
            "1fVQrSZV31k",
            "MOsQFsa6ZzI",
            "WleKBw7nYzk"
        ];

        let player;
        let isPlaying = false;
        let ytReady = false;
        let currentTrackIndex = -1;

        function getRandomTrackIndex() {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * ytPlaylist.length);
            } while (nextIndex === currentTrackIndex && ytPlaylist.length > 1);
            return nextIndex;
        }

        /* YouTube Iframe API Callback */
        function onYouTubeIframeAPIReady() {
            currentTrackIndex = getRandomTrackIndex();
            player = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: ytPlaylist[currentTrackIndex],
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            ytReady = true;
            player.setVolume(20);
        }

        function onPlayerStateChange(event) {
            // Automatically play next random music track when current video ends
            if (event.data === YT.PlayerState.ENDED && isPlaying) {
                playRandomNextTrack();
            }
        }

        function playRandomNextTrack() {
            currentTrackIndex = getRandomTrackIndex();
            if (player && ytReady) {
                player.loadVideoById(ytPlaylist[currentTrackIndex]);
                player.playVideo();
            }
        }

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const wrapper = document.getElementById('audioWrapper');
            
            if (!isPlaying) {
                if (ytReady && player) {
                    player.playVideo();
                    isPlaying = true;
                    btn.innerHTML = "🔊 Sound ON";
                    wrapper.classList.remove('muted');
                    wrapper.classList.add('unmuted');
                }
            } else {
                if (ytReady && player) {
                    player.pauseVideo();
                    isPlaying = false;
                    btn.innerHTML = "🔇 Sound OFF";
                    wrapper.classList.remove('unmuted');
                    wrapper.classList.add('muted');
                }
            }
        }

        const soundBg = new Audio("bg.mp3");
        const soundClick = new Audio("click.mp3");

        soundBg.volume = 0.05;
        soundClick.volume = 0.05;

        function playFx(audioObj) {
            audioObj.currentTime = 0;
            audioObj.play().catch(() => {});
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            playFx(soundClick);

            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('#audioWrapper') || e.target.closest('.top-left-profile') || e.target.closest('#titleLine')) return;
            playFx(soundBg);
            spawnInteraction(e.clientX, e.clientY);
        });

        /* Countdown Timer */
        const targetDate = new Date("2027-11-25T08:30:00+05:30").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(d).padStart(2, '0');
            document.getElementById("hours").innerText = String(h).padStart(2, '0');
            document.getElementById("minutes").innerText = String(m).padStart(2, '0');
            document.getElementById("seconds").innerText = String(s).padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
