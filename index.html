<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020208;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Pure CSS Deep Space Background */
        .space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #0d102d 0%, #050614 60%, #000000 100%);
            z-index: 1;
        }

        /* CSS Planets */
        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: 2;
        }

        /* Realistic Earth with Atmosphere Glow */
        .earth {
            width: 140px;
            height: 140px;
            bottom: 8%;
            left: 6%;
            background: radial-gradient(circle at 30% 30%, #4facfe 0%, #00f2fe 20%, #103362 60%, #020b18 100%);
            box-shadow: inset -20px -20px 40px #000, 0 0 35px rgba(0, 242, 254, 0.4);
            animation: floatSlow 12s ease-in-out infinite alternate;
        }

        /* Earth Clouds Overlay */
        .earth::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.4) 0%, transparent 60%);
            filter: blur(4px);
        }

        /* Mars */
        .mars {
            width: 90px;
            height: 90px;
            top: 12%;
            right: 8%;
            background: radial-gradient(circle at 35% 35%, #ff7b54 0%, #ff5252 30%, #7a1c11 70%, #200402 100%);
            box-shadow: inset -15px -15px 25px #000, 0 0 25px rgba(255, 82, 82, 0.35);
            animation: floatSlow 10s ease-in-out infinite alternate-reverse;
        }

        /* Moon */
        .moon {
            width: 55px;
            height: 55px;
            bottom: 18%;
            right: 12%;
            background: radial-gradient(circle at 35% 35%, #e0e0e0 0%, #9e9e9e 50%, #424242 85%, #0f0f0f 100%);
            box-shadow: inset -10px -10px 18px #000, 0 0 15px rgba(220, 220, 220, 0.2);
            animation: floatSlow 14s ease-in-out infinite alternate;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-18px) rotate(5deg); }
        }

        /* Satellite SVG Flying Across */
        .satellite-container {
            position: absolute;
            top: 25%;
            left: -100px;
            z-index: 3;
            animation: flySatellite 22s linear infinite;
        }

        @keyframes flySatellite {
            0% { transform: translateX(0) translateY(0) rotate(15deg); }
            100% { transform: translateX(calc(100vw + 200px)) translateY(120px) rotate(25deg); }
        }

        /* Rocket Flying Upward */
        .rocket-container {
            position: absolute;
            bottom: -100px;
            left: 18%;
            z-index: 3;
            animation: flyRocket 16s ease-in-out infinite;
            animation-delay: 3s;
        }

        @keyframes flyRocket {
            0% { transform: translateY(0) translateX(0) rotate(-35deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(calc(-100vh - 200px)) translateX(300px) rotate(-35deg); opacity: 0; }
        }

        /* Canvas Overlay for Twinkling Stars & Comets */
        canvas#spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Interactive Particle Burst */
        #particleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            will-change: transform, opacity;
            pointer-events: none;
            animation: particleFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, #ff007f, #a855f7, #3b82f6, #00f2fe, #4facfe, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.7));
            cursor: pointer;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .double-spin {
            animation: doubleSpinAnim 1.1s cubic-bezier(0.25, 1, 0.3, 1) forwards;
        }

        @keyframes doubleSpinAnim {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            45% { transform: translateY(-65px) rotateY(360deg) scale(1.25); }
            85% { transform: translateY(8px) rotateY(720deg) scale(0.95); }
            100% { transform: translateY(0) rotateY(720deg) scale(1); }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .box {
            background: rgba(6, 8, 24, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .box:hover {
            border-color: rgba(139, 92, 246, 0.8);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        }

        .card-bounce {
            animation: cardPopAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPopAnim {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .number {
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #a78bfa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="space-bg"></div>

    <!-- Embedded High Resolution SVG Spacecraft Assets -->
    <div class="planet earth"></div>
    <div class="planet mars"></div>
    <div class="planet moon"></div>

    <div class="satellite-container">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 7 9 3 5 7l4 4"></path>
            <path d="m17 11 4 4-4 4-4-4"></path>
            <path d="m8 12 4 4"></path>
            <path d="m11 9 3 3"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
    </div>

    <div class="rocket-container">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="#ff5252" stroke="#ffffff" stroke-width="1">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.71.12-2.47-.73-3.32a2.38 2.38 0 0 0-2.27-.68Z"></path>
            <path d="M12 15l-3-3 8.5-8.5a2.12 2.12 0 0 1 3 3L12 15Z"></path>
            <path d="M9 18l3 3 8.5-8.5a2.12 2.12 0 0 0-3-3L9 18Z"></path>
        </svg>
    </div>

    <canvas id="spaceCanvas"></canvas>
    <div id="particleContainer"></div>

    <div class="container">
        <h1 id="mainTitle" onclick="triggerTitleEffect()">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <audio id="tadaSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playTadaSound() {
            const sound = document.getElementById('tadaSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log(e));
            }
        }

        function playPopSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function burstParticles(centerX, centerY, icons) {
            const container = document.getElementById('particleContainer');
            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.innerText = icons[Math.floor(Math.random() * icons.length)];
                const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5);
                const distance = Math.random() * 110 + 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 20;
                const rot = (Math.random() - 0.5) * 360;

                el.style.left = `${centerX}px`;
                el.style.top = `${centerY}px`;
                el.style.setProperty('--tx', `${tx}px`);
                el.style.setProperty('--ty', `${ty}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                container.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            }
        }

        function triggerTitleEffect() {
            const title = document.getElementById('mainTitle');
            if (title.classList.contains('double-spin')) return;
            playTadaSound();
            title.classList.add('double-spin');
            const rect = title.getBoundingClientRect();
            burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ['📚', '🎓', '✏️', '💡', '📐', '🧪', '📖', '✨']);
            setTimeout(() => title.classList.remove('double-spin'), 1100);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            const card = e.currentTarget;
            playPopSound();
            card.classList.remove('card-bounce');
            void card.offsetWidth;
            card.classList.add('card-bounce');
        }

        // Countdown Timer
        const examDate = new Date("August 3, 2027 08:30:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Stars and Shooting Comets Engine
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let comets = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 1800);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        class Comet {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width * 1.5;
                this.y = -50;
                this.len = Math.random() * 120 + 60;
                this.speed = Math.random() * 8 + 4;
                this.size = Math.random() * 1.8 + 0.6;
                this.active = false;
                this.waitTime = Date.now() + Math.random() * 4000;
            }
            update() {
                if (!this.active) {
                    if (Date.now() > this.waitTime) this.active = true;
                    return;
                }
                this.x -= this.speed;
                this.y += this.speed;
                if (this.x < -150 || this.y > canvas.height + 150) this.reset();
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                const grad = ctx.createLinearGradient(this.x, this.y, this.x + this.len, this.y - this.len);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.2, '#00f2fe');
                grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.size;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.len, this.y - this.len);
                ctx.stroke();
                ctx.restore();
            }
        }

        comets = Array.from({ length: 5 }, () => new Comet());

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Twinkling Stars
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.save();
                ctx.globalAlpha = Math.abs(s.alpha);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Render Comets
            comets.forEach(c => {
                c.update();
                c.draw();
            });

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        render();
    </script>
</body>
</html>
