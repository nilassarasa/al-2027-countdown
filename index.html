<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020208;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1200px;
        }

        /* Ambient Space Canvas */
        canvas#spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Floating Space Elements Layer */
        #spaceItemsContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .space-obj {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            will-change: transform;
            transition: transform 0.2s ease;
        }

        .space-obj:active {
            transform: scale(1.3) !important;
        }

        /* Sun & Glow Effect */
        .sun {
            top: 8%;
            left: 8%;
            font-size: 4rem;
            animation: sunGlow 4s ease-in-out infinite alternate, floatSlow 12s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 25px #ffaa00) drop-shadow(0 0 50px #ff5500);
        }

        @keyframes sunGlow {
            0% { filter: drop-shadow(0 0 20px #ffaa00) drop-shadow(0 0 40px #ff5500); transform: scale(1); }
            100% { filter: drop-shadow(0 0 35px #ffdd00) drop-shadow(0 0 70px #ff3300); transform: scale(1.08); }
        }

        /* Planets */
        .earth {
            top: 68%;
            left: 10%;
            font-size: 3.2rem;
            animation: floatSlow 10s ease-in-out infinite alternate;
        }

        .mars {
            top: 18%;
            right: 12%;
            font-size: 2.8rem;
            animation: floatSlow 14s ease-in-out infinite alternate-reverse;
        }

        .moon {
            top: 75%;
            right: 15%;
            font-size: 2.5rem;
            animation: floatSlow 9s ease-in-out infinite alternate;
        }

        /* Orbiting Rocket & Satellite */
        .rocket {
            font-size: 3rem;
            animation: flyRocket 22s linear infinite;
        }

        .satellite {
            font-size: 2.5rem;
            animation: orbitSat 28s linear infinite;
        }

        @keyframes flyRocket {
            0% { transform: translate(-100px, 80vh) rotate(45deg); }
            100% { transform: translate(110vw, -100px) rotate(45deg); }
        }

        @keyframes orbitSat {
            0% { transform: translate(110vw, 30vh) rotate(-15deg); }
            100% { transform: translate(-100px, 60vh) rotate(-15deg); }
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-18px) rotate(10deg); }
        }

        /* Click Burst Particles Container */
        #particleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .edu-item {
            position: absolute;
            font-size: 1.8rem;
            will-change: transform, opacity;
            pointer-events: none;
            animation: eduFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes eduFly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        /* Multi-color Animated Title */
        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            
            background: linear-gradient(
                90deg, 
                #ff007f, 
                #a855f7, 
                #3b82f6, 
                #00f2fe, 
                #4facfe, 
                #ff007f
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;

            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.5));
            cursor: pointer;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .double-spin {
            animation: doubleSpinAnim 1.1s cubic-bezier(0.25, 1, 0.3, 1) forwards;
        }

        @keyframes doubleSpinAnim {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            45% { transform: translateY(-65px) rotateY(360deg) scale(1.25); }
            85% { transform: translateY(8px) rotateY(720deg) scale(0.95); }
            100% { transform: translateY(0) rotateY(720deg) scale(1); }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .box {
            background: rgba(10, 12, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .box:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
        }

        .card-bounce {
            animation: cardPopAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPopAnim {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .number {
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #a78bfa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>
    
    <!-- Floating Space Interactive Elements -->
    <div id="spaceItemsContainer">
        <div class="space-obj sun" onclick="triggerSpaceObject(event, '☀️')">☀️</div>
        <div class="space-obj earth" onclick="triggerSpaceObject(event, '🌍')">🌍</div>
        <div class="space-obj mars" onclick="triggerSpaceObject(event, '🔴')">🔴</div>
        <div class="space-obj moon" onclick="triggerSpaceObject(event, '🌙')">🌙</div>
        <div class="space-obj rocket" onclick="triggerSpaceObject(event, '🚀')">🚀</div>
        <div class="space-obj satellite" onclick="triggerSpaceObject(event, '🛰️')">🛰️</div>
    </div>

    <div id="particleContainer"></div>

    <div class="container">
        <h1 id="mainTitle" onclick="triggerTitleEffect()">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <audio id="tadaSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        // Ta-Daaa Sound
        function playTadaSound() {
            const sound = document.getElementById('tadaSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio block:", e));
            }
        }

        // Card Pop Sound
        function playPopSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            const now = audioCtx.currentTime;

            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);

            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.1);
        }

        // Sci-Fi Space Beep Sound for Planets/Rockets
        function playSpaceSound() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            const now = audioCtx.currentTime;

            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        // Burst Particles
        function burstParticles(centerX, centerY, icons) {
            const container = document.getElementById('particleContainer');
            const count = 12;

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'edu-item';
                el.innerText = icons[Math.floor(Math.random() * icons.length)];

                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5);
                const distance = Math.random() * 110 + 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 20;
                const rot = (Math.random() - 0.5) * 360;

                el.style.left = `${centerX}px`;
                el.style.top = `${centerY}px`;
                el.style.setProperty('--tx', `${tx}px`);
                el.style.setProperty('--ty', `${ty}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                container.appendChild(el);

                setTimeout(() => el.remove(), 1200);
            }
        }

        // Handle Clicking Sun, Planets, Rocket & Satellite
        function triggerSpaceObject(e, emoji) {
            e.stopPropagation();
            playSpaceSound();

            const rect = e.currentTarget.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            burstParticles(centerX, centerY, [emoji, '⭐', '✨', '💫']);
        }

        // Title Double Spin Handler
        function triggerTitleEffect() {
            const title = document.getElementById('mainTitle');
            if (title.classList.contains('double-spin')) return;

            playTadaSound();
            title.classList.add('double-spin');

            const rect = title.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            setTimeout(() => {
                burstParticles(centerX, centerY, ['📚', '🎓', '✏️', '💡', '📐', '🧪', '📖', '✨']);
            }, 850);

            setTimeout(() => {
                title.classList.remove('double-spin');
            }, 1100);
        }

        // Card Click Handler
        function triggerCardEffect(e) {
            e.stopPropagation();
            const card = e.currentTarget;

            playPopSound();

            card.classList.remove('card-bounce');
            void card.offsetWidth;
            card.classList.add('card-bounce');
        }

        // Countdown Logic
        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Stars & Nebula Background
        const spaceCanvas = document.getElementById('spaceCanvas');
        const ctx = spaceCanvas.getContext('2d');
        let stars = [];

        function resizeSpace() {
            spaceCanvas.width = window.innerWidth;
            spaceCanvas.height = window.innerHeight;
            stars = [];

            const count = Math.floor((spaceCanvas.width * spaceCanvas.height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * spaceCanvas.width,
                    y: Math.random() * spaceCanvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function animateSpace() {
            ctx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);

            // Deep Space Nebula Glow
            const nebula = ctx.createRadialGradient(
                spaceCanvas.width * 0.5, spaceCanvas.height * 0.5, 10,
                spaceCanvas.width * 0.5, spaceCanvas.height * 0.5, spaceCanvas.width
            );
            nebula.addColorStop(0, '#0c0721');
            nebula.addColorStop(0.5, '#050414');
            nebula.addColorStop(1, '#020208');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, spaceCanvas.width, spaceCanvas.height);

            // Twinkling Stars
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;

                ctx.save();
                ctx.globalAlpha = Math.abs(s.alpha);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(animateSpace);
        }

        window.addEventListener('resize', resizeSpace);
        resizeSpace();
        animateSpace();
    </script>
</body>
</html>
