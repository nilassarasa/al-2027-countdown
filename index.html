<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Bottom Right Unmute/Mute Toggle Control with Bouncing Effect */
        .audio-control {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            background: rgba(13, 12, 28, 0.85);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        .audio-control.bouncing {
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        @keyframes bouncePulse {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-12px) scale(1.05);
                box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Responsive Title Layout */
        h1 {
            font-size: clamp(1.3rem, 4.5vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            color: #ffffff;
            background: linear-gradient(90deg, #ff007f, #a855f7, #00f0ff, #3b82f6, #ff007f);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s linear infinite;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6));
            cursor: pointer;
        }

        h1 .char {
            display: inline-block;
            animation: combinedSequence 9s ease-in-out infinite;
            animation-delay: var(--delay);
        }

        h1 .space {
            display: inline-block;
            width: 0.35em;
        }

        @keyframes combinedSequence {
            0% { transform: translateY(0) skewX(0deg); filter: none; }
            8% { transform: translateY(-16px) skewX(0deg); }
            16% { transform: translateY(0) skewX(0deg); }
            
            35%, 50% { 
                transform: translateY(0) skewX(0deg);
                filter: none;
            }

            53% {
                transform: translateY(-3px) skewX(-3deg);
                filter: drop-shadow(-3px 0 #00f0ff);
            }
            58% {
                transform: translateY(3px) skewX(3deg);
                filter: drop-shadow(3px 0 #ff007f);
            }
            63% {
                transform: translateY(-2px) skewX(-2deg);
                filter: drop-shadow(-2px 1px #a855f7);
            }
            68% {
                transform: translateY(1px) skewX(1deg);
                filter: drop-shadow(2px 0 #00f0ff);
            }

            70%, 100% {
                transform: translateY(0) skewX(0deg);
                filter: none;
            }
        }

        h1.jump-spin-effect {
            animation: rainbowShift 4s linear infinite, titleJumpSpin 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes titleJumpSpin {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            40% { transform: translateY(-35px) rotateY(180deg) scale(1.2); }
            100% { transform: translateY(0) rotateY(360deg) scale(1); }
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Countdown Cards Layout */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Quotes with Animated Shimmer Gradient */
        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }
            80% { opacity: 0.9; transform: translate(-2px, 1px) skewX(5deg); }
            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }
    </style>
</head>
<body>

    <!-- Bottom Right Bouncing Unmute Control -->
    <button class="audio-control bouncing" id="audioBtn" onclick="toggleAudio()">🔇 Tap to Unmute</button>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <h1 id="title" onclick="triggerTitleAction(event)">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quoteDisplay"></div>
        </div>
    </div>

    <script>
        // Restored Title Letter Spanning Logic
        const titleEl = document.getElementById('title');
        const text = titleEl.textContent;
        titleEl.textContent = '';

        text.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.08}s`);
            }
            titleEl.appendChild(span);
        });

        // Background Tracklist (Random initial selection & auto-looping next track)
        const bgPlaylist = [
            "YTDown.com_YouTube_No-Copyright-Groove-Day-Hip-Hop-Beat-Gro_Media_7sUZbh_3m0Q_007_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-KONOSOO-No-Copyright-Thanks-NNX_Media_MOsQFsa6ZzI_005_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-HEMENESY-No-Copyright_Media_1fVQrSZV31k_005_48k.m4a",
            "YTDown.com_YouTube_FULL-BASS-REMIX-Linkin-Park-In-The-End-N_Media_8YoHeuN0v0k_004_48k(1).m4a"
        ];

        let currentTrackIndex = Math.floor(Math.random() * bgPlaylist.length);
        const bgAudio = new Audio();
        bgAudio.volume = 0.06;

        function loadTrack(index) {
            bgAudio.src = bgPlaylist[index];
            bgAudio.load();
        }

        // Play next random track on song completion
        bgAudio.addEventListener('ended', () => {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * bgPlaylist.length);
            } while (nextIndex === currentTrackIndex && bgPlaylist.length > 1);
            currentTrackIndex = nextIndex;
            loadTrack(currentTrackIndex);
            bgAudio.play();
        });

        loadTrack(currentTrackIndex);

        // Audio Effects setup (Volume: 0.05)
        const soundBg = new Audio("bg.mp3");
        const soundClick = new Audio("click.mp3");
        const soundTitle = new Audio("title.mp3");

        soundBg.volume = 0.05;
        soundClick.volume = 0.05;
        soundTitle.volume = 0.05;

        function playFx(audioObj) {
            audioObj.currentTime = 0;
            audioObj.play().catch(() => {});
        }

        let isPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = "🔊 Sound ON";
                    btn.classList.remove('bouncing');
                }).catch(err => console.log("Audio play blocked:", err));
            } else {
                bgAudio.pause();
                isPlaying = false;
                btn.innerHTML = "🔇 Sound OFF";
                btn.classList.add('bouncing');
            }
        }

        // Interaction Handlers with sound effects
        function triggerTitleAction(e) {
            e.stopPropagation();
            playFx(soundTitle);

            titleEl.classList.remove('jump-spin-effect');
            void titleEl.offsetWidth;
            titleEl.classList.add('jump-spin-effect');

            const rect = titleEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            spawnInteraction(centerX, centerY);
            spawnEduItems(centerX, centerY);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            playFx(soundClick);

            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
        }

        window.addEventListener('click', (e) => {
            if (e.target.id === 'audioBtn') return;
            playFx(soundBg);
            spawnInteraction(e.clientX, e.clientY);
        });

        // Quotes System
        const quotes = [
            "~ Time is an illusion ~ ⏳ ✨ 🌌 Douglas Adams",
            "~ Lost time is never found again ~ ⌛ 🪙 🔑 Benjamin Franklin",
            "~ The problem is, you think you have time ~ 👁️ 🍃 Jack Kornfield",
            "~ Time moves in one direction, memory in another ~ 🧠 🕯️ William Gibson",
            "~ Time is the most valuable thing a man can spend ~ 💎 ⚖️ Theophrastus",
            "~ Time flies over us, but leaves its shadow behind ~ 🕊️ ⛅ Nathaniel Hawthorne",
            "~ Time is a storm in which we are all lost ~ ⛈️ 🌪️ William Carlos Williams",
            "~ How did it get so late so soon? ~ 🌙 🦉 Dr. Seuss",
            "~ Time is a dressmaker specializing in alterations ~ 🪡 🧵 Faith Baldwin",
            "~ Time, which strengthens friendship, weakens love ~ 🤝 🥀 🖤 Jean de La Bruyère",
            "~ Your time is limited, so don't waste it living someone else's life ~ 🚀 💡 🌟 Steve Jobs",
            "~ They always say time changes things, but you actually have to change them yourself ~ ⚡ 🎨 Andy Warhol",
            "~ Time is a created thing. To say 'I don't have time' is like saying 'I don't want to' ~ 🛠️ ☯️ Lao Tzu",
            "~ The two most powerful warriors are patience and time ~ ⚔️ 🛡️ Leo Tolstoy",
            "~ Better three hours too soon than a minute too late ~ ⏰ 🗝️ William Shakespeare",
            "~ Time is what we want most, but what we use worst ~ ⏳ 🗑️ William Penn",
            "~ The future is something which everyone reaches at the rate of sixty minutes an hour ~ 🚶 🧭 C.S. Lewis",
            "~ Punctuality is the thief of time ~ 🕵️ 🎩 Oscar Wilde",
            "~ Realize that now, in this moment, time is stopping for nothing ~ 📍 🏃 ✨ Steve Maraboli",
            "~ Time slips away like sand through an hourglass ~ 🏖️ ⌛ 🌊 Traditional Proverb"
        ];

        let currentQuoteIndex = 0;
        const quoteDisplay = document.getElementById('quoteDisplay');
        quoteDisplay.textContent = quotes[currentQuoteIndex];

        function rotateQuote() {
            quoteDisplay.classList.remove('glitch-in');
            quoteDisplay.classList.add('glitch-out');

            setTimeout(() => {
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
                quoteDisplay.textContent = quotes[currentQuoteIndex];
                quoteDisplay.classList.remove('glitch-out');
                quoteDisplay.classList.add('glitch-in');
            }, 400);
        }

        setInterval(rotateQuote, 6000);

        // Countdown Timer Logic
        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Particle & Spark Background
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let effects = [];
        const numStars = 180;
        const speed = 0.8;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * canvas.width * 2;
                this.y = (Math.random() - 0.5) * canvas.height * 2;
                this.z = Math.random() * canvas.width;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = canvas.width;
                }
            }
            draw() {
                const k = 128 / this.z;
                const px = this.x * k + canvas.width / 2;
                const py = this.y * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(0.1, (1 - this.z / canvas.width) * 2.5);
                    const alpha = Math.min(1, (1 - this.z / canvas.width) * 1.2);

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) stars.push(new Star());
        }

        class Ring {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.life = 1;
                this.color = ['#00f0ff', '#ff007f', '#a855f7'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.radius += 3;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 4 + 1.5;
                this.vx = Math.cos(angle) * spd;
                this.vy = Math.sin(angle) * spd;
                this.size = Math.random() * 3 + 1;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class EduItem {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
                const speed = Math.random() * 7 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.25;
                this.items = ['🎓', '📚', '✏️', '💡', '📐', '📝', '🔬'];
                this.symbol = this.items[Math.floor(Math.random() * this.items.length)];
                this.size = Math.floor(Math.random() * 12) + 20;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.2;
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
                this.life -= 0.015;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        function spawnInteraction(x, y) {
            effects.push(new Ring(x, y));
            for (let i = 0; i < 22; i++) {
                effects.push(new Spark(x, y));
            }
        }

        function spawnEduItems(x, y) {
            for (let i = 0; i < 14; i++) {
                effects.push(new EduItem(x, y));
            }
        }

        function animate() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            effects.forEach((e, index) => {
                e.update();
                e.draw();
                if (e.life <= 0) effects.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
