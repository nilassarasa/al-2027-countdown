<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000002;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1200px;
        }

        /* Real Canvas Layer */
        canvas#spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        /* Particle Explosions */
        #particleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            will-change: transform, opacity;
            pointer-events: none;
            animation: particleFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        /* Animated Title */
        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            
            background: linear-gradient(
                90deg, 
                #ff007f, 
                #a855f7, 
                #3b82f6, 
                #00f2fe, 
                #4facfe, 
                #ff007f
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;

            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.5));
            cursor: pointer;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .double-spin {
            animation: doubleSpinAnim 1.1s cubic-bezier(0.25, 1, 0.3, 1) forwards;
        }

        @keyframes doubleSpinAnim {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            45% { transform: translateY(-65px) rotateY(360deg) scale(1.25); }
            85% { transform: translateY(8px) rotateY(720deg) scale(0.95); }
            100% { transform: translateY(0) rotateY(720deg) scale(1); }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .box {
            background: rgba(5, 7, 20, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .box:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
        }

        .card-bounce {
            animation: cardPopAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPopAnim {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .number {
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #a78bfa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>
    <div id="particleContainer"></div>

    <div class="container">
        <h1 id="mainTitle" onclick="triggerTitleEffect()">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <audio id="tadaSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playTadaSound() {
            const sound = document.getElementById('tadaSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked:", e));
            }
        }

        function playPopSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function playSpaceSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(1400, now + 0.22);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        function burstParticles(centerX, centerY, icons) {
            const container = document.getElementById('particleContainer');
            const count = 14;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.innerText = icons[Math.floor(Math.random() * icons.length)];
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5);
                const distance = Math.random() * 110 + 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 20;
                const rot = (Math.random() - 0.5) * 360;

                el.style.left = `${centerX}px`;
                el.style.top = `${centerY}px`;
                el.style.setProperty('--tx', `${tx}px`);
                el.style.setProperty('--ty', `${ty}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                container.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            }
        }

        function triggerTitleEffect() {
            const title = document.getElementById('mainTitle');
            if (title.classList.contains('double-spin')) return;
            playTadaSound();
            title.classList.add('double-spin');
            const rect = title.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            setTimeout(() => {
                burstParticles(centerX, centerY, ['📚', '🎓', '✏️', '💡', '📐', '🧪', '📖', '✨']);
            }, 850);

            setTimeout(() => {
                title.classList.remove('double-spin');
            }, 1100);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            const card = e.currentTarget;
            playPopSound();
            card.classList.remove('card-bounce');
            void card.offsetWidth;
            card.classList.add('card-bounce');
        }

        // Countdown Logic
        const examDate = new Date("August 3, 2027 08:30:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // High Resolution Photorealistic Canvas Space Simulation
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        // Assets
        const sources = {
            sun: 'https://upload.wikimedia.org/wikipedia/commons/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.png',
            earth: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Earth_Western_Hemisphere_transparent_background.png/600px-Earth_Western_Hemisphere_transparent_background.png',
            mars: 'https://upload.wikimedia.org/wikipedia/commons/3/36/3D_Mars.png',
            moon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.png/600px-FullMoon2010.png',
            rocket: 'https://pngimg.com/uploads/rocket/rocket_PNG13.png',
            sat: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Hubble_Space_Telescope_in_orbit.png/600px-Hubble_Space_Telescope_in_orbit.png'
        };

        const images = {};
        let loadedCount = 0;
        const totalImages = Object.keys(sources).length;

        for (let key in sources) {
            images[key] = new Image();
            images[key].crossOrigin = "Anonymous";
            images[key].src = sources[key];
            images[key].onload = () => {
                loadedCount++;
            };
        }

        let stars = [];
        let spaceObjects = [];

        function resizeSpace() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 2500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.6,
                    alpha: Math.random(),
                    speed: Math.random() * 0.015 + 0.005
                });
            }

            initObjects();
        }

        function initObjects() {
            spaceObjects = [
                { id: 'sun', x: canvas.width * 0.12, y: canvas.height * 0.18, size: 140, rot: 0, rotSpeed: 0.001, pulse: 0 },
                { id: 'earth', x: canvas.width * 0.15, y: canvas.height * 0.78, size: 90, rot: 0, rotSpeed: 0.003, dy: 0.2, yDirection: 1 },
                { id: 'mars', x: canvas.width * 0.85, y: canvas.height * 0.22, size: 70, rot: 0, rotSpeed: -0.002, dy: 0.15, yDirection: -1 },
                { id: 'moon', x: canvas.width * 0.82, y: canvas.height * 0.80, size: 55, rot: 0, rotSpeed: 0.001, dy: 0.25, yDirection: 1 },
                { 
                    id: 'rocket', 
                    x: -100, 
                    y: canvas.height * 0.85, 
                    size: 80, 
                    vx: (canvas.width + 200) / 700, 
                    vy: -canvas.height / 700, 
                    angle: -Math.PI / 4 
                },
                { 
                    id: 'sat', 
                    x: canvas.width + 100, 
                    y: canvas.height * 0.3, 
                    size: 75, 
                    vx: -(canvas.width + 200) / 1000, 
                    vy: canvas.height * 0.2 / 1000, 
                    angle: 0.1 
                }
            ];
        }

        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Deep Space Gradient
            const nebula = ctx.createRadialGradient(
                canvas.width * 0.5, canvas.height * 0.5, 10,
                canvas.width * 0.5, canvas.height * 0.5, canvas.width
            );
            nebula.addColorStop(0, '#060818');
            nebula.addColorStop(0.6, '#02030d');
            nebula.addColorStop(1, '#000002');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.save();
                ctx.globalAlpha = Math.abs(s.alpha);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Real Space Assets
            spaceObjects.forEach(obj => {
                const img = images[obj.id];
                if (!img || !img.complete) return;

                ctx.save();

                // Object Physics
                obj.rot += obj.rotSpeed || 0;
                if (obj.dy) {
                    obj.y += obj.dy * obj.yDirection;
                    if (obj.y > canvas.height * 0.85 || obj.y < canvas.height * 0.15) obj.yDirection *= -1;
                }

                if (obj.id === 'rocket' || obj.id === 'sat') {
                    obj.x += obj.vx;
                    obj.y += obj.vy;
                    if (obj.id === 'rocket' && obj.x > canvas.width + 150) {
                        obj.x = -150;
                        obj.y = canvas.height * 0.85;
                    }
                    if (obj.id === 'sat' && obj.x < -150) {
                        obj.x = canvas.width + 150;
                        obj.y = canvas.height * 0.3;
                    }
                }

                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle || obj.rot);

                // Realistic Sun Flare Effect
                if (obj.id === 'sun') {
                    obj.pulse += 0.02;
                    const glowSize = obj.size * 0.8 + Math.sin(obj.pulse) * 8;
                    const sunGlow = ctx.createRadialGradient(0, 0, obj.size * 0.3, 0, 0, glowSize);
                    sunGlow.addColorStop(0, 'rgba(255, 180, 0, 0.8)');
                    sunGlow.addColorStop(0.5, 'rgba(255, 80, 0, 0.3)');
                    sunGlow.addColorStop(1, 'rgba(255, 0, 0, 0)');
                    ctx.fillStyle = sunGlow;
                    ctx.beginPath();
                    ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.drawImage(img, -obj.size / 2, -obj.size / 2, obj.size, obj.size);
                ctx.restore();
            });

            requestAnimationFrame(drawSpace);
        }

        // Click Handling on Canvas Space Objects
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            spaceObjects.forEach(obj => {
                const dist = Math.hypot(clickX - obj.x, clickY - obj.y);
                if (dist < obj.size / 1.5) {
                    playSpaceSound();
                    burstParticles(obj.x, obj.y, ['⭐', '✨', '💫', '💥']);
                    obj.size *= 1.15;
                    setTimeout(() => obj.size /= 1.15, 200);
                }
            });
        });

        window.addEventListener('resize', resizeSpace);
        resizeSpace();
        drawSpace();
    </script>
</body>
</html>
