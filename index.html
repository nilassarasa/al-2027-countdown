<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 3D Canvas Background */
        canvas#spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Click Burst Particles */
        #particleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            will-change: transform, opacity;
            pointer-events: none;
            animation: particleFly 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 20px 10px;
        }

        /* Animated Title */
        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, #ff007f, #a855f7, #3b82f6, #00f2fe, #4facfe, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.5));
            cursor: pointer;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .double-spin {
            animation: doubleSpinAnim 1.1s cubic-bezier(0.25, 1, 0.3, 1) forwards;
        }

        @keyframes doubleSpinAnim {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            45% { transform: translateY(-65px) rotateY(360deg) scale(1.25); }
            85% { transform: translateY(8px) rotateY(720deg) scale(0.95); }
            100% { transform: translateY(0) rotateY(720deg) scale(1); }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .box {
            background: rgba(5, 7, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .box:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
        }

        .card-bounce {
            animation: cardPopAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPopAnim {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .number {
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #a78bfa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>
    <div id="particleContainer"></div>

    <div class="container">
        <h1 id="mainTitle" onclick="triggerTitleEffect()">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <audio id="tadaSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playTadaSound() {
            const sound = document.getElementById('tadaSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log(e));
            }
        }

        function playPopSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function playSpaceSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
        }

        function burstParticles(centerX, centerY, icons) {
            const container = document.getElementById('particleContainer');
            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.innerText = icons[Math.floor(Math.random() * icons.length)];
                const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5);
                const distance = Math.random() * 110 + 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 20;
                const rot = (Math.random() - 0.5) * 360;

                el.style.left = `${centerX}px`;
                el.style.top = `${centerY}px`;
                el.style.setProperty('--tx', `${tx}px`);
                el.style.setProperty('--ty', `${ty}px`);
                el.style.setProperty('--rot', `${rot}deg`);

                container.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            }
        }

        function triggerTitleEffect() {
            const title = document.getElementById('mainTitle');
            if (title.classList.contains('double-spin')) return;
            playTadaSound();
            title.classList.add('double-spin');
            const rect = title.getBoundingClientRect();
            burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ['📚', '🎓', '✏️', '💡', '📐', '🧪', '📖', '✨']);
            setTimeout(() => title.classList.remove('double-spin'), 1100);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            const card = e.currentTarget;
            playPopSound();
            card.classList.remove('card-bounce');
            void card.offsetWidth;
            card.classList.add('card-bounce');
        }

        // Countdown Timer
        const examDate = new Date("August 3, 2027 08:30:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Three.js 3D Real Space Simulation Engine
        const canvas = document.getElementById('spaceCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffddaa, 3, 100);
        sunLight.position.set(-15, 10, 5);
        scene.add(sunLight);

        // Texture Loader
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = 'anonymous';

        // Starfield Background
        const starGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 300;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.9 });
        const starMesh = new THREE.Points(starGeo, starMat);
        scene.add(starMesh);

        // 3D Objects Array for Raycasting
        const interactiveObjects = [];

        // 1. Sun
        const sunGeo = new THREE.SphereGeometry(3, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({
            map: loader.load('https://upload.wikimedia.org/wikipedia/commons/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.png')
        });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(-14, 9, -5);
        scene.add(sun);
        interactiveObjects.push(sun);

        // 2. Earth
        const earthGeo = new THREE.SphereGeometry(2.2, 32, 32);
        const earthMat = new THREE.MeshStandardMaterial({
            map: loader.load('https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Earth_Western_Hemisphere_transparent_background.png/600px-Earth_Western_Hemisphere_transparent_background.png'),
            roughness: 0.6
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-11, -9, 0);
        scene.add(earth);
        interactiveObjects.push(earth);

        // 3. Mars
        const marsGeo = new THREE.SphereGeometry(1.6, 32, 32);
        const marsMat = new THREE.MeshStandardMaterial({
            map: loader.load('https://upload.wikimedia.org/wikipedia/commons/3/36/3D_Mars.png'),
            roughness: 0.8
        });
        const mars = new THREE.Mesh(marsGeo, marsMat);
        mars.position.set(13, 8, -2);
        scene.add(mars);
        interactiveObjects.push(mars);

        // 4. Moon
        const moonGeo = new THREE.SphereGeometry(1.1, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({
            map: loader.load('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.png/600px-FullMoon2010.png'),
            roughness: 0.9
        });
        const moon = new THREE.Mesh(moonGeo, moonMat);
        moon.position.set(12, -8, 1);
        scene.add(moon);
        interactiveObjects.push(moon);

        // 5. Satellite (Hubble)
        const satGeo = new THREE.PlaneGeometry(3, 2);
        const satMat = new THREE.MeshBasicMaterial({
            map: loader.load('https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Hubble_Space_Telescope_in_orbit.png/600px-Hubble_Space_Telescope_in_orbit.png'),
            transparent: true,
            side: THREE.DoubleSide
        });
        const satellite = new THREE.Mesh(satGeo, satMat);
        satellite.position.set(15, 2, 2);
        scene.add(satellite);
        interactiveObjects.push(satellite);

        // 6. Space Rocket
        const rocketGeo = new THREE.PlaneGeometry(2.5, 3.5);
        const rocketMat = new THREE.MeshBasicMaterial({
            map: loader.load('https://pngimg.com/uploads/rocket/rocket_PNG13.png'),
            transparent: true,
            side: THREE.DoubleSide
        });
        const rocket = new THREE.Mesh(rocketGeo, rocketMat);
        rocket.position.set(-18, -2, 3);
        rocket.rotation.z = -Math.PI / 4;
        scene.add(rocket);
        interactiveObjects.push(rocket);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Object Rotations
            sun.rotation.y += 0.002;
            earth.rotation.y += 0.005;
            mars.rotation.y += 0.004;
            moon.rotation.y += 0.003;

            // Rocket Orbit Trajectory
            rocket.position.x += 0.035;
            rocket.position.y += 0.015;
            if (rocket.position.x > 22) {
                rocket.position.x = -22;
                rocket.position.y = -6;
            }

            // Satellite Gentle Floating
            satellite.position.x -= 0.015;
            satellite.rotation.z += 0.002;
            if (satellite.position.x < -22) {
                satellite.position.x = 22;
            }

            renderer.render(scene, camera);
        }
        animate();

        // 3D Object Click Raycaster Handler
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                playSpaceSound();
                burstParticles(event.clientX, event.clientY, ['⭐', '✨', '🚀', '💫', '💥']);

                // Click Bounce Animation
                hitObject.scale.set(1.3, 1.3, 1.3);
                setTimeout(() => hitObject.scale.set(1, 1, 1), 250);
            }
        });

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
