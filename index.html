<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Left Circular Profile Logo */
        .top-left-profile {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: block;
            text-decoration: none;
            transition: transform 0.3s ease;
            perspective: 800px; /* Perspective added for 3D depth */
        }

        .top-left-profile img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            /* Pink glowing pulse + Coin Flip-and-Pause animation */
            animation: pinkPulse 2s infinite ease-in-out, coinFlipPause 7s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
            cursor: pointer;
            transform-style: preserve-3d;
        }

        .top-left-profile:hover {
            transform: scale(1.15);
        }

        /* Coin Spin along Y-axis (Horizontal spin) with pauses */
        @keyframes coinFlipPause {
            0% {
                transform: rotateY(0deg);
            }
            /* Fast coin spins (3 full 360-degree rotations = 1080deg) */
            45% {
                transform: rotateY(1080deg);
            }
            /* Pause and stay facing forward for the rest of the keyframe duration */
            100% {
                transform: rotateY(1080deg);
            }
        }

        @keyframes pinkPulse {
            0%, 100% {
                box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            }
            50% {
                box-shadow: 0 0 25px #ff007f, 0 0 50px #ff007f;
            }
        }

        /* Running Border Button Container */
        .audio-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: 175px;
            height: 48px;
            border-radius: 30px;
            isolation: isolate;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .audio-wrapper .border-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .audio-wrapper rect.border-path {
            fill: none;
            stroke-width: 3;
            rx: 24px;
            ry: 24px;
            stroke-dasharray: 80 320;
            animation: runAround 1.8s linear infinite;
        }

        .audio-wrapper.muted {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        .audio-wrapper.muted rect.border-path {
            stroke: url(#pinkCyanGradient);
            filter: drop-shadow(0 0 4px #ff007f) drop-shadow(0 0 8px #00f0ff);
        }

        .audio-wrapper.unmuted {
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .audio-wrapper.unmuted rect.border-path {
            stroke: url(#greenCyanGradient);
            filter: drop-shadow(0 0 4px #00ffaa) drop-shadow(0 0 8px #00f0ff);
            animation: runAround 2.6s linear infinite;
        }

        .audio-control {
            position: relative;
            z-index: 2;
            background: #0d0c1c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            will-change: transform;
        }

        @keyframes runAround {
            0% { stroke-dashoffset: 400; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            animation: fullTitleGlitchShake 8s ease-in-out infinite;
        }

        .title-line .space {
            width: 0.4em;
        }

        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 8s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
            8% {
                transform: translateY(-22px) scale(1.15);
                color: #00f0ff;
                text-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #ff007f,
                    0 0 36px #a855f7;
            }
            16%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 60% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
            61% {
                transform: translate(-8px, 1px) skewX(-4deg);
                filter: drop-shadow(-5px 0 #00f0ff) drop-shadow(5px 0 #ff007f);
            }
            63% {
                transform: translate(8px, -2px) skewX(5deg);
                filter: drop-shadow(6px 0 #a855f7) drop-shadow(-6px 0 #00f0ff);
            }
            65% {
                transform: translate(-4px, 1px) skewX(-2deg);
                filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff);
            }
            67% {
                transform: translate(5px, -1px) skewX(3deg);
                filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7);
            }
            69% {
                transform: translate(-6px, 2px) skewX(-3deg);
                filter: drop-shadow(-5px 0 #ff007f) drop-shadow(3px 0 #00f0ff);
            }
            71% {
                transform: translate(3px, -1px) skewX(1deg);
                filter: drop-shadow(3px 0 #00f0ff);
            }
            73%, 100% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }
            80% { opacity: 0.9; transform: translate(-2px, 1px) skewX(5deg); }
            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }
    </style>
</head>

            do {

            currentTrackIndex = nextIndex;
            loadTrack(currentTrackIndex);

            } else {
                bgAudio.pause();
                isPlaying = false;
                btn.innerHTML = "🔇 Sound OFF";
                wrapper.classList.remove('unmuted');
                wrapper.classList.add('muted');

            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            "~ 𝚃𝚑𝚎𝚢 𝚊𝚕𝚠𝚊𝚢𝚜 𝚜𝚊𝚢 𝚝𝚒𝚖𝚎 𝚌𝚑𝚊𝚗𝚐𝚎𝚜 𝚝𝚑𝚒𝚗𝚐𝚜, 𝚋𝚞𝚝 𝚢𝚘𝚞 𝚊𝚌𝚝𝚞𝚊𝚕𝚕𝚢 You mean a **horizontal wheel or turnstile effect**—where an object spins around a vertical axis (like a revolving door or a coin spinning flat on a table) in brief bursts, pauses, and then spins again.

Here is a pure CSS keyframe animation that spins the element horizontally (around the Y-axis), pauses, and then spins again.

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .spin-container {
      /* Gives the 3D depth perspective */
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .spinning-card {
      width: 120px;
      height: 120px;
      background: #4A90E2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-weight: bold;
      border-radius: 12px;
      
      /* Apply the burst-pause animation */
      animation: horizontalBurst 6s ease-in-out infinite;
    }

    @keyframes horizontalBurst {
      /* 0% to 30%: Spin 3 full turns (1080 deg) around Y-axis */
      0% {
        transform: rotateY(0deg);
      }
      30% {
        transform: rotateY(1080deg); 
      }

      /* 30% to 60%: PAUSE / HOLD in place for ~2 seconds */
      60% {
        transform: rotateY(1080deg);
      }

      /* 60% to 90%: Spin another 3 turns (2160 deg total) */
      90% {
        transform: rotateY(2160deg);
      }

      /* 90% to 100%: Short pause before the loop restarts cleanly */
      100% {
        transform: rotateY(2160deg);
      }
    }
  </style>
</head>
<body>

  <div class="spin-container">
    <div class="spinning-card">SPIN</div>
  </div>

</body>
