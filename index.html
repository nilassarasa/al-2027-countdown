<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Running Border Button Container */
        .audio-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: 175px;
            height: 48px;
            border-radius: 30px;
            isolation: isolate;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        /* Fixed SVG Overflow Clipping */
        .audio-wrapper .border-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .audio-wrapper rect.border-path {
            fill: none;
            stroke-width: 3;
            rx: 24px;
            ry: 24px;
            stroke-dasharray: 80 320;
            animation: runAround 1.8s linear infinite;
        }

        /* Mode 1: Muted - Hot Pink / Cyan light running around border */
        .audio-wrapper.muted {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        .audio-wrapper.muted rect.border-path {
            stroke: url(#pinkCyanGradient);
            filter: drop-shadow(0 0 4px #ff007f) drop-shadow(0 0 8px #00f0ff);
        }

        /* Mode 2: Unmuted - Emerald / Cyan light running around border */
        .audio-wrapper.unmuted {
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .audio-wrapper.unmuted rect.border-path {
            stroke: url(#greenCyanGradient);
            filter: drop-shadow(0 0 4px #00ffaa) drop-shadow(0 0 8px #00f0ff);
            animation: runAround 2.6s linear infinite;
        }

        .audio-control {
            position: relative;
            z-index: 2;
            background: #0d0c1c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            will-change: transform;
        }

        @keyframes runAround {
            0% { stroke-dashoffset: 400; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Circular Profile Image */
        .profile-container {
            margin-bottom: 18px;
            position: relative;
            cursor: pointer;
        }

        .profile-circle {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-container:hover .profile-circle {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 45px rgba(255, 0, 127, 0.7);
        }

        /* Title Container */
        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            animation: fullTitleGlitchShake 8s ease-in-out infinite;
        }

        .title-line .space {
            width: 0.4em;
        }

        /* Individual Letters */
        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 8s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
            8% {
                transform: translateY(-22px) scale(1.15);
                color: #00f0ff;
                text-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #ff007f,
                    0 0 36px #a855f7;
            }
            16%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 60% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
            61% {
                transform: translate(-8px, 1px) skewX(-4deg);
                filter: drop-shadow(-5px 0 #00f0ff) drop-shadow(5px 0 #ff007f);
            }
            63% {
                transform: translate(8px, -2px) skewX(5deg);
                filter: drop-shadow(6px 0 #a855f7) drop-shadow(-6px 0 #00f0ff);
            }
            65% {
                transform: translate(-4px, 1px) skewX(-2deg);
                filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff);
            }
            67% {
                transform: translate(5px, -1px) skewX(3deg);
                filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7);
            }
            69% {
                transform: translate(-6px, 2px) skewX(-3deg);
                filter: drop-shadow(-5px 0 #ff007f) drop-shadow(3px 0 #00f0ff);
            }
            71% {
                transform: translate(3px, -1px) skewX(1deg);
                filter: drop-shadow(3px 0 #00f0ff);
            }
            73%, 100% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
        }

        /* Countdown Cards Layout */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Quotes Styling */
        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }
            80% { opacity: 0.9; transform: translate(-2px, 1px) skewX(5deg); }
            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }
    </style>
</head>
<body>

    <div class="audio-wrapper muted" id="audioWrapper">
        <svg class="border-svg" width="100%" height="100%">
            <defs>
                <linearGradient id="pinkCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff007f" />
                    <stop offset="50%" stop-color="#00f0ff" />
                    <stop offset="100%" stop-color="#ff007f" />
                </linearGradient>
                <linearGradient id="greenCyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00ffaa" />
                    <stop offset="50%" stop-color="#00f0ff" />
                    <stop offset="100%" stop-color="#00ffaa" />
                </linearGradient>
            </defs>
            <rect class="border-path" x="1.5" y="1.5" width="172" height="45" />
        </svg>

        <button class="audio-control" id="audioBtn" onclick="toggleAudio()">🔇 Sound OFF</button>
    </div>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <!-- Image Circle Added Here -->
        <div class="profile-container" onclick="triggerProfileEffect(event)">
            <img src="profile.jpg" alt="Profile" class="profile-circle" id="profileImg">
        </div>

        <div class="title-line" id="titleLine" onclick="triggerTitleAction(event)">2027 A/L COUNTDOWN</div>

        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quoteDisplay"></div>
        </div>
    </div>

    <script>
        const titleEl = document.getElementById('titleLine');
        const titleText = titleEl.textContent;
        titleEl.textContent = '';

        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.08}s`);
            }
            titleEl.appendChild(span);
        });

        const bgPlaylist = [
            "YTDown.com_YouTube_No-Copyright-Groove-Day-Hip-Hop-Beat-Gro_Media_7sUZbh_3m0Q_007_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-KONOSOO-No-Copyright-Thanks-NNX_Media_MOsQFsa6ZzI_005_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-HEMENESY-No-Copyright_Media_1fVQrSZV31k_005_48k.m4a",
            "YTDown.com_YouTube_FULL-BASS-REMIX-Linkin-Park-In-The-End-N_Media_8YoHeuN0v0k_004_48k(1).m4a"
        ];

        let currentTrackIndex = Math.floor(Math.random() * bgPlaylist.length);
        const bgAudio = new Audio();
        bgAudio.volume = 0.06;

        function loadTrack(index) {
            bgAudio.src = bgPlaylist[index];
            bgAudio.load();
        }

        bgAudio.addEventListener('ended', () => {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * bgPlaylist.length);
            } while (nextIndex === currentTrackIndex && bgPlaylist.length > 1);
            currentTrackIndex = nextIndex;
            loadTrack(currentTrackIndex);
            bgAudio.play();
        });

        loadTrack(currentTrackIndex);

        const soundBg = new Audio("bg.mp3");
        const soundClick = new Audio("click.mp3");
        const soundTitle = new Audio("title.mp3");

        soundBg.volume = 0.05;
        soundClick.volume = 0.05;
        soundTitle.volume = 0.05;

        function playFx(audioObj) {
            audioObj.currentTime = 0;
            audioObj.play().catch(() => {});
        }

        let isPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const wrapper = document.getElementById('audioWrapper');
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = "🔊 Sound ON";
                    wrapper.classList.remove('muted');
                    wrapper.classList.add('unmuted');
                }).catch(err => console.log("Audio play blocked:", err));
            } else {
                bgAudio.pause();
                isPlaying = false;
                btn.innerHTML = "🔇 Sound OFF";
                wrapper.classList.remove('unmuted');
                wrapper.classList.add('muted');
            }
        }

        function triggerProfileEffect(e) {
            e.stopPropagation();
            playFx(soundTitle);
            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
            spawnEduItems(x, y);
        }

        function triggerTitleAction(e) {
            e.stopPropagation();
            playFx(soundTitle);

            const rect = titleEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            spawnInteraction(centerX, centerY);
            spawnEduItems(centerX, centerY);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            playFx(soundClick);

            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('#audioWrapper')) return;
            playFx(soundBg);
            spawnInteraction(e.clientX, e.clientY);
        });

        const quotes = [
            "~ 𝚃𝚒𝚖𝚎 𝚒𝚜 𝚊𝚗 𝚒𝚕𝚕𝚞𝚜𝚒𝚘𝚗 ⏳ ✨ 🌌 ~",
            "~ 𝙻𝚘𝚜𝚝 𝚝𝚒𝚖𝚎 𝚒𝚜 𝚗𝚎𝚟𝚎𝚛 𝚏𝚘𝚞𝚗𝚍 𝚊𝚐𝚊𝚒𝚗 ⌛ 🪙 🔑 ~",
            "~ 𝚃𝚑𝚎 𝚙𝚛𝚘𝚋𝚕𝚎𝚖 𝚒𝚜, 𝚢𝚘𝚞 𝚝𝚑𝚒𝚗𝚔 𝚢𝚘𝚞 𝚑𝚊𝚟𝚎 𝚝𝚒𝚖𝚎 👁️ 🍃 ~",
            "~ 𝚃𝚒𝚖𝚎 𝚖𝚘𝚟𝚎𝚜 𝚒𝚗 𝚘𝚗𝚎 𝚍𝚒𝚛𝚎𝚌𝚝𝚒𝚘𝚗, 𝚖𝚎𝚖𝚘𝚛𝚢 𝚒𝚗 𝚊𝚗𝚘𝚝𝚑𝚎𝚛 🧠 🕯️ ~",
            "~ 𝚃𝚒𝚖𝚎 𝚒𝚜 𝚝𝚑𝚎 𝚖𝚘𝚜𝚝 𝚟𝚊𝚕𝚞𝚊𝚋𝚕𝚎 𝚝𝚑𝚒𝚗𝚐 𝚊 𝚖𝚊𝚗 𝚌𝚊𝚗 𝚜𝚙𝚎𝚗𝚍 💎 ⚖️ ~",
            "~ 𝚃𝚒𝚖𝚎 𝚏𝚕𝚒𝚎𝚜 𝚘𝚟𝚎𝚛 𝚞𝚜, 𝚋𝚞𝚝 𝚕𝚎𝚊𝚟𝚎𝚜 𝚒𝚝𝚜 𝚜𝚑𝚊𝚍𝚘𝚠 𝚋𝚎𝚑𝚒𝚗𝚍 🕊️ ⛅ ~",
            "~ 𝚃𝚒𝚖𝚎 𝚒𝚜 𝚊 𝚜𝚝𝚘𝚛𝚖 𝚒𝚗 𝚠𝚑𝚒𝚌𝚑 𝚠𝚎 𝚊𝚛𝚎 𝚊𝚕𝚕 𝚕𝚘𝚜𝚝 ⛈️ 🌪️ ~",
            "~ 𝙷𝚘𝚠 𝚍𝚒𝚍 𝚒𝚝 𝚐𝚎𝚝 𝚜𝚘 𝚕𝚊𝚝𝚎 𝚜𝚘 𝚜𝚘𝚘𝚗? 🌙 🦉 ~",
            "~ 𝚃𝚒𝚖𝚎 𝚒𝚜 𝚊 𝚍𝚛𝚎𝚜𝚜𝚖𝚊𝚔𝚎𝚛 𝚜𝚙𝚎𝚌𝚒𝚊𝚕𝚒𝚣𝚒𝚗𝚐 𝚒𝚗 𝚊𝚕𝚝𝚎𝚛𝚊𝚝𝚒𝚘𝚗𝚜 🪡 🧵 ~",
            "~ 𝚃𝚒𝚖𝚎, 𝚠𝚑𝚒𝚌𝚑 𝚜𝚝𝚛𝚎𝚗𝚐𝚝𝚑𝚎𝚗𝚜 𝚏𝚛𝚒𝚎𝚗𝚍𝚜𝚑𝚒𝚙, 𝚠𝚎𝚊𝚔𝚎𝚗𝚜 𝚕𝚘𝚟𝚎 🤝 🥀 🖤 ~",
            "~ 𝚈𝚘𝚞𝚛 𝚝𝚒𝚖𝚎 𝚒𝚜 𝚕𝚒𝚖𝚒𝚝𝚎𝚍, 𝚜𝚘 𝚍𝚘𝚗'𝚝 𝚠𝚊𝚜𝚝𝚎 𝚒𝚝 𝚕𝚒𝚟𝚒𝚗𝚐 𝚜𝚘𝚖𝚎𝚘𝚗𝚎 𝚎𝚕𝚜𝚎'𝚜 𝚕𝚒𝚏𝚎 🚀 💡 🌟 ~",
            "~ 𝚃𝚑𝚎𝚢 𝚊𝚕𝚠𝚊𝚢𝚜 𝚜𝚊𝚢 𝚝𝚒𝚖𝚎 𝚌𝚑𝚊𝚗𝚐𝚎𝚜 𝚝𝚑𝚒𝚗𝚐𝚜, 𝚋𝚞𝚝 𝚢𝚘𝚞 𝚊𝚌𝚝𝚞𝚊𝚕𝚕𝚢 𝚑𝚊𝚟𝚎 𝚝𝚘 𝚌𝚑𝚊𝚗𝚐𝚎 𝚝𝚑𝚎𝚖 𝚢𝚘𝚞𝚛𝚜𝚎𝚕𝚏 ⚡ 🎨 ~",
            "~ 𝚃𝚒𝚖𝚎 𝚒𝚜 𝚊 𝚌𝚛𝚎𝚊𝚝𝚎𝚍 𝚝𝚑𝚒𝚗𝚐. 𝚃𝚘 𝚜𝚊𝚢 '𝙸 𝚍𝚘𝚗'𝚝 have time' 𝚒𝚜 𝚕𝚒𝚔𝚎 𝚜𝚊𝚢𝚒𝚗𝚐 '𝙸 𝚍𝚘𝚗'𝚝 𝚠𝚊𝚗𝚝 𝚝𝚘' 🌱 ☀️ ~"
        ];

        let quoteIndex = 0;
        const quoteEl = document.getElementById('quoteDisplay');

        function updateQuote() {
            quoteEl.classList.remove('glitch-in');
            quoteEl.classList.add('glitch-out');

            setTimeout(() => {
                quoteEl.textContent = quotes[quoteIndex];
                quoteIndex = (quoteIndex + 1) % quotes.length;
                quoteEl.classList.remove('glitch-out');
                quoteEl.classList.add('glitch-in');
            }, 400);
        }

        updateQuote();
        setInterval(updateQuote, 7000);

        // Target Date: August 1, 2027
        const targetDate = new Date('August 1, 2027 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = d < 10 ? '0' + d : d;
            document.getElementById('hours').textContent = h < 10 ? '0' + h : h;
            document.getElementById('minutes').textContent = m < 10 ? '0' + m : m;
            document.getElementById('seconds').textContent = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Interactive Canvas Starfield Background & 3D Forward Warp Effect
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const numStars = 350;
        const forwardStars = [];

        function resetStar(star) {
            star.x = (Math.random() - 0.5) * canvas.width * 2;
            star.y = (Math.random() - 0.5) * canvas.height * 2;
            star.z = canvas.width;
            star.pz = canvas.width;
            star.color = Math.random() > 0.8 ? (Math.random() > 0.5 ? '#00f0ff' : '#a855f7') : '#ffffff';
        }

        for (let i = 0; i < numStars; i++) {
            const star = {};
            resetStar(star);
            star.z = Math.random() * canvas.width;
            star.pz = star.z;
            forwardStars.push(star);
        }

        const particles = [];
        const eduItems = [];
        const eduSymbols = ['📚', '✏️', '🎓', '🔬', '📐', '🧬', '⚡', '💡', '📖'];

        function spawnInteraction(x, y) {
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: Math.random() > 0.5 ? '#00f0ff' : '#ff007f',
                    life: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        function spawnEduItems(x, y) {
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                eduItems.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    symbol: eduSymbols[Math.floor(Math.random() * eduSymbols.length)],
                    size: Math.random() * 12 + 18,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    rot: Math.random() * Math.PI,
                    vRot: (Math.random() - 0.5) * 0.1
                });
            }
        }

        // Particle speed updated to 1.5
        const speed = 1.5;

        function animate() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Draw 3D Forward-Moving Particles
            forwardStars.forEach(star => {
                star.pz = star.z;
                star.z -= speed;

                if (star.z <= 0) {
                    resetStar(star);
                }

                const k = 256 / star.z;
                const px = star.x * k + cx;
                const py = star.y * k + cy;

                const pk = 256 / star.pz;
                const ppx = star.x * pk + cx;
                const ppy = star.y * pk + cy;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(0.1, (1 - star.z / canvas.width) * 3);
                    const alpha = Math.min(1, (1 - star.z / canvas.width) * 1.5);

                    ctx.beginPath();
                    ctx.moveTo(ppx, ppy);
                    ctx.lineTo(px, py);
                    ctx.strokeStyle = star.color;
                    ctx.globalAlpha = alpha;
                    ctx.lineWidth = size;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(px, py, size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = star.color;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            });

            // Draw Click Sparkle Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            // Draw Floating Edu Icons
            for (let i = eduItems.length - 1; i >= 0; i--) {
                const item = eduItems[i];
                item.x += item.vx;
                item.y += item.vy;
                item.rot += item.vRot;
                item.life -= item.decay;

                if (item.life <= 0) {
                    eduItems.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.rot);
                ctx.font = `${item.size}px sans-serif`;
                ctx.globalAlpha = item.life;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.symbol, 0, 0);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
