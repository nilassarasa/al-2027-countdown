<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 520px;
            text-align: center;
            padding: 10px;
        }

        /* Multi-Color Rainbow Shifting Title */
        h1 {
            font-size: clamp(1.1rem, 5.5vw, 2.4rem);
            font-weight: 900;
            white-space: nowrap;
            letter-spacing: 1px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ff007f, #a855f7, #00f0ff, #3b82f6, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6));
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            width: 100%;
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <h1>2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event, 600)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event, 750)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event, 900)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event, 1050)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Synth Engine
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playFuturisticSound(freq = 520) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + 0.12);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // Countdown Logic
        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Engine
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let effects = [];
        const numStars = 180;
        const speed = 0.8;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * canvas.width * 2;
                this.y = (Math.random() - 0.5) * canvas.height * 2;
                this.z = Math.random() * canvas.width;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = canvas.width;
                }
            }
            draw() {
                const k = 128 / this.z;
                const px = this.x * k + canvas.width / 2;
                const py = this.y * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(0.1, (1 - this.z / canvas.width) * 2.5);
                    const alpha = Math.min(1, (1 - this.z / canvas.width) * 1.2);

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) stars.push(new Star());
        }

        // Particle Explosions & Shockwave Rings
        class Ring {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = 55;
                this.life = 1;
                this.color = ['#00f0ff', '#ff007f', '#a855f7'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.radius += 3;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 4 + 1.5;
                this.vx = Math.cos(angle) * spd;
                this.vy = Math.sin(angle) * spd;
                this.size = Math.random() * 3 + 1;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnInteraction(x, y) {
            effects.push(new Ring(x, y));
            for (let i = 0; i < 22; i++) {
                effects.push(new Spark(x, y));
            }
        }

        function animate() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            effects.forEach((e, index) => {
                e.update();
                e.draw();
                if (e.life <= 0) effects.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('click', (e) => {
            spawnInteraction(e.clientX, e.clientY);
            playFuturisticSound(480);
        });

        function triggerCardEffect(e, soundFreq) {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
            playFuturisticSound(soundFreq);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
