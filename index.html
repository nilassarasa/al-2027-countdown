<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
        }

        /* Title Outer Box Setup */
        h1 {
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
            display: inline-block;
            position: relative;
            cursor: pointer;
            white-space: nowrap;
            line-height: 1.4;
        }

        /* Individual Spanned Characters for Wave Jump */
        h1 .char {
            display: inline-block;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            animation: combinedCycle 8s ease-in-out infinite;
            animation-delay: var(--delay);
        }

        /* Spaces Fix for Mobile WebKit */
        h1 .space {
            display: inline-block;
            width: 0.35em;
        }

        /* Glitch Slice 1 (Cyan Overlay) */
        h1::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #00f0ff;
            background: #020205;
            clip-path: inset(0 0 0 0);
            opacity: 0;
            animation: glitchCyan 8s infinite;
            pointer-events: none;
        }

        /* Glitch Slice 2 (Magenta Overlay) */
        h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #ff007f;
            background: #020205;
            clip-path: inset(0 0 0 0);
            opacity: 0;
            animation: glitchMagenta 8s infinite;
            pointer-events: none;
        }

        /* Keyframes for Jump Wave + Light Blue Glow */
        @keyframes combinedCycle {
            0% {
                transform: translateY(0);
                color: #ffffff;
                text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            }
            10% {
                transform: translateY(-18px);
                color: #00f0ff;
                text-shadow: 0 0 15px #00f0ff, 0 0 25px #00f0ff, 0 0 35px #3b82f6;
            }
            20% {
                transform: translateY(0);
                color: #a855f7;
                text-shadow: 0 0 12px #ff007f;
            }
            35%, 50% {
                transform: translateY(0);
                color: #ffffff;
                text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            }
            50.1%, 70% {
                color: #ffffff;
            }
            70.1%, 100% {
                transform: translateY(0);
                color: #ffffff;
                text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            }
        }

        /* Glitch Layer Keyframes - Cyan Slice */
        @keyframes glitchCyan {
            0%, 50%, 70.1%, 100% {
                opacity: 0;
                transform: translate(0);
            }
            52% {
                opacity: 0.95;
                transform: translate(-3px, -2px);
                clip-path: inset(20% 0 60% 0);
            }
            55% {
                opacity: 0.95;
                transform: translate(2px, 1px);
                clip-path: inset(50% 0 20% 0);
            }
            58% {
                opacity: 0.95;
                transform: translate(-2px, 2px);
                clip-path: inset(10% 0 75% 0);
            }
            62% {
                opacity: 0.95;
                transform: translate(3px, -1px);
                clip-path: inset(70% 0 10% 0);
            }
            65% {
                opacity: 0;
            }
        }

        /* Glitch Layer Keyframes - Magenta Slice */
        @keyframes glitchMagenta {
            0%, 50%, 70.1%, 100% {
                opacity: 0;
                transform: translate(0);
            }
            52% {
                opacity: 0.95;
                transform: translate(3px, 1px);
                clip-path: inset(60% 0 15% 0);
            }
            55% {
                opacity: 0.95;
                transform: translate(-2px, -2px);
                clip-path: inset(15% 0 65% 0);
            }
            58% {
                opacity: 0.95;
                transform: translate(2px, -1px);
                clip-path: inset(80% 0 5% 0);
            }
            62% {
                opacity: 0.95;
                transform: translate(-3px, 2px);
                clip-path: inset(5% 0 85% 0);
            }
            65% {
                opacity: 0;
            }
        }

        /* Manual Spin Effect on User Click */
        h1.jump-spin-effect {
            animation: titleJumpSpin 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes titleJumpSpin {
            0% { transform: translateY(0) rotateY(0deg) scale(1); }
            40% { transform: translateY(-30px) rotateY(180deg) scale(1.15); }
            100% { transform: translateY(0) rotateY(360deg) scale(1); }
        }

        /* Countdown Grid Setup */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <h1 id="title" data-text="2027 A/L COUNTDOWN" onclick="triggerTitleAction(event)">2027 A/L COUNTDOWN</h1>
        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Preload custom MP3 audio file
        const customSound = new Audio('click.mp3');
        
        // Adjust volume (0.0 = muted, 0.3 = 30% volume, 1.0 = 100% volume)
        customSound.volume = 0.1; 

        function playCustomSound() {
            customSound.currentTime = 0; // Rewinds audio so rapid consecutive taps play instantly
            customSound.play().catch(e => {
                console.log("Audio play allowed on user interaction");
            });
        }

        // Wrap Title Characters into Spans safely
        const titleEl = document.getElementById('title');
        const text = titleEl.textContent;
        titleEl.textContent = '';

        text.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.08}s`);
            }
            titleEl.appendChild(span);
        });

        function triggerTitleAction(e) {
            e.stopPropagation();
            titleEl.classList.remove('jump-spin-effect');
            void titleEl.offsetWidth;
            titleEl.classList.add('jump-spin-effect');

            const rect = titleEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            spawnInteraction(centerX, centerY);
            spawnEduItems(centerX, centerY);
            playCustomSound();
        }

        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let effects = [];
        const numStars = 180;
        const speed = 0.8;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * canvas.width * 2;
                this.y = (Math.random() - 0.5) * canvas.height * 2;
                this.z = Math.random() * canvas.width;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = canvas.width;
                }
            }
            draw() {
                const k = 128 / this.z;
                const px = this.x * k + canvas.width / 2;
                const py = this.y * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(0.1, (1 - this.z / canvas.width) * 2.5);
                    const alpha = Math.min(1, (1 - this.z / canvas.width) * 1.2);

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) stars.push(new Star());
        }

        class Ring {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.life = 1;
                this.color = ['#00f0ff', '#ff007f', '#a855f7'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.radius += 3;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 4 + 1.5;
                this.vx = Math.cos(angle) * spd;
                this.vy = Math.sin(angle) * spd;
                this.size = Math.random() * 3 + 1;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class EduItem {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
                const speed = Math.random() * 7 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.25;
                this.items = ['🎓', '📚', '✏️', '💡', '📐', '📝', '🔬'];
                this.symbol = this.items[Math.floor(Math.random() * this.items.length)];
                this.size = Math.floor(Math.random() * 12) + 20;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.2;
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
                this.life -= 0.015;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        function spawnInteraction(x, y) {
            effects.push(new Ring(x, y));
            for (let i = 0; i < 22; i++) {
                effects.push(new Spark(x, y));
            }
        }

        function spawnEduItems(x, y) {
            for (let i = 0; i < 14; i++) {
                effects.push(new EduItem(x, y));
            }
        }

        function animate() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            effects.forEach((e, index) => {
                e.update();
                e.draw();
                if (e.life <= 0) effects.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('click', (e) => {
            spawnInteraction(e.clientX, e.clientY);
            playCustomSound();
        });

        function triggerCardEffect(e) {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
            playCustomSound();
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
