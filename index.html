<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2027 A/L Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Running Light Audio Control Wrapper */
        .audio-wrapper {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            padding: 3px;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .audio-wrapper::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(from 0deg, #ff007f, #00f0ff, #a855f7, #ff007f);
            animation: rotateBorder 2.5s linear infinite;
        }

        /* Muted State - Neon Pink/Cyan Pulse */
        .audio-wrapper.muted {
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.6);
            animation: bouncePulse 1.2s infinite ease-in-out;
        }

        .audio-wrapper.muted::before {
            background: conic-gradient(from 0deg, #ff007f, #00f0ff, #ff0055, #a855f7, #ff007f);
            animation: rotateBorder 1.8s linear infinite;
        }

        /* Unmuted State - Vibrant Emerald/Cyan Flow */
        .audio-wrapper.unmuted {
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.7);
        }

        .audio-wrapper.unmuted::before {
            background: conic-gradient(from 0deg, #00ffaa, #00f0ff, #3b82f6, #00ffaa);
            animation: rotateBorder 3s linear infinite;
        }

        .audio-control {
            position: relative;
            z-index: 2;
            background: #0d0c1c;
            border: none;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 32px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            width: 100%;
            height: 100%;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 760px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Container */
        .title-line {
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: clamp(1.2rem, 4.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            animation: fullTitleGlitchShake 8s ease-in-out infinite;
        }

        .title-line .space {
            width: 0.4em;
        }

        /* Individual Letters */
        .title-line .char {
            display: inline-block;
            color: #ffffff;
            animation: letterJumpWave 8s ease-in-out infinite;
            animation-delay: var(--delay);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        @keyframes letterJumpWave {
            0% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
            8% {
                transform: translateY(-22px) scale(1.15);
                color: #00f0ff;
                text-shadow: 
                    0 0 12px #00f0ff,
                    0 0 24px #ff007f,
                    0 0 36px #a855f7;
            }
            16%, 100% {
                transform: translateY(0) scale(1);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            }
        }

        @keyframes fullTitleGlitchShake {
            0%, 60% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
            61% {
                transform: translate(-8px, 1px) skewX(-4deg);
                filter: drop-shadow(-5px 0 #00f0ff) drop-shadow(5px 0 #ff007f);
            }
            63% {
                transform: translate(8px, -2px) skewX(5deg);
                filter: drop-shadow(6px 0 #a855f7) drop-shadow(-6px 0 #00f0ff);
            }
            65% {
                transform: translate(-4px, 1px) skewX(-2deg);
                filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff);
            }
            67% {
                transform: translate(5px, -1px) skewX(3deg);
                filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7);
            }
            69% {
                transform: translate(-6px, 2px) skewX(-3deg);
                filter: drop-shadow(-5px 0 #ff007f) drop-shadow(3px 0 #00f0ff);
            }
            71% {
                transform: translate(3px, -1px) skewX(1deg);
                filter: drop-shadow(3px 0 #00f0ff);
            }
            73%, 100% {
                transform: translate(0, 0) skewX(0deg);
                filter: none;
            }
        }

        /* Countdown Cards Layout */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .box {
            background: rgba(13, 12, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 22px 8px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .box:active {
            transform: scale(0.92);
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .number {
            font-size: clamp(2rem, 7.5vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Quotes Styling */
        .quote-container {
            margin-top: 35px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .quote-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            background: linear-gradient(90deg, #00f0ff, #a855f7, #ff007f, #00f0ff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: quoteShimmer 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        @keyframes quoteShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .quote-text.glitch-out {
            animation: quoteGlitchOut 0.4s forwards;
        }

        .quote-text.glitch-in {
            animation: quoteGlitchIn 0.4s forwards, quoteShimmer 4s linear infinite;
        }

        @keyframes quoteGlitchOut {
            0% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
            30% { opacity: 0.8; transform: translate(-5px, 2px) skewX(12deg); filter: drop-shadow(-4px 0 #ff007f) drop-shadow(4px 0 #00f0ff); }
            60% { opacity: 0.4; transform: translate(5px, -2px) skewX(-12deg); filter: drop-shadow(4px 0 #00f0ff) drop-shadow(-4px 0 #a855f7); }
            100% { opacity: 0; transform: translate(0, 0) skewX(0deg); }
        }

        @keyframes quoteGlitchIn {
            0% { opacity: 0; transform: translate(0, 0) skewX(0deg); filter: drop-shadow(-4px 0 #00f0ff) drop-shadow(4px 0 #ff007f); }
            40% { opacity: 0.6; transform: translate(4px, -2px) skewX(-10deg); }
            80% { opacity: 0.9; transform: translate(-2px, 1px) skewX(5deg); }
            100% { opacity: 1; transform: translate(0, 0) skewX(0deg); }
        }
    </style>
</head>
<body>

    <div class="audio-wrapper muted" id="audioWrapper">
        <button class="audio-control" id="audioBtn" onclick="toggleAudio()">🔇 Tap to Unmute</button>
    </div>

    <canvas id="starfieldCanvas"></canvas>

    <div class="container">
        <div class="title-line" id="titleLine" onclick="triggerTitleAction(event)">2027 A/L COUNTDOWN</div>

        <div class="countdown">
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box" onclick="triggerCardEffect(event)">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quoteDisplay"></div>
        </div>
    </div>

    <script>
        const titleEl = document.getElementById('titleLine');
        const titleText = titleEl.textContent;
        titleEl.textContent = '';

        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.className = 'space';
            } else {
                span.className = 'char';
                span.textContent = char;
                span.style.setProperty('--delay', `${index * 0.08}s`);
            }
            titleEl.appendChild(span);
        });

        const bgPlaylist = [
            "YTDown.com_YouTube_No-Copyright-Groove-Day-Hip-Hop-Beat-Gro_Media_7sUZbh_3m0Q_007_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-KONOSOO-No-Copyright-Thanks-NNX_Media_MOsQFsa6ZzI_005_48k.m4a",
            "YTDown.com_YouTube_NNX-LXSY-HEMENESY-No-Copyright_Media_1fVQrSZV31k_005_48k.m4a",
            "YTDown.com_YouTube_FULL-BASS-REMIX-Linkin-Park-In-The-End-N_Media_8YoHeuN0v0k_004_48k(1).m4a"
        ];

        let currentTrackIndex = Math.floor(Math.random() * bgPlaylist.length);
        const bgAudio = new Audio();
        bgAudio.volume = 0.06;

        function loadTrack(index) {
            bgAudio.src = bgPlaylist[index];
            bgAudio.load();
        }

        bgAudio.addEventListener('ended', () => {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * bgPlaylist.length);
            } while (nextIndex === currentTrackIndex && bgPlaylist.length > 1);
            currentTrackIndex = nextIndex;
            loadTrack(currentTrackIndex);
            bgAudio.play();
        });

        loadTrack(currentTrackIndex);

        const soundBg = new Audio("bg.mp3");
        const soundClick = new Audio("click.mp3");
        const soundTitle = new Audio("title.mp3");

        soundBg.volume = 0.05;
        soundClick.volume = 0.05;
        soundTitle.volume = 0.05;

        function playFx(audioObj) {
            audioObj.currentTime = 0;
            audioObj.play().catch(() => {});
        }

        let isPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const wrapper = document.getElementById('audioWrapper');
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = "🔊 Sound ON";
                    wrapper.classList.remove('muted');
                    wrapper.classList.add('unmuted');
                }).catch(err => console.log("Audio play blocked:", err));
            } else {
                bgAudio.pause();
                isPlaying = false;
                btn.innerHTML = "🔇 Sound OFF";
                wrapper.classList.remove('unmuted');
                wrapper.classList.add('muted');
            }
        }

        function triggerTitleAction(e) {
            e.stopPropagation();
            playFx(soundTitle);

            const rect = titleEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            spawnInteraction(centerX, centerY);
            spawnEduItems(centerX, centerY);
        }

        function triggerCardEffect(e) {
            e.stopPropagation();
            playFx(soundClick);

            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            spawnInteraction(x, y);
        }

            "~ 𝚃𝚒𝚖𝚎 𝚒𝚜 𝚠𝚑𝚊𝚝 𝚠𝚎 𝚠𝚊𝚗𝚝 𝚖𝚘𝚜𝚝, 𝚋𝚞𝚝 𝚠𝚑𝚊𝚝 𝚠𝚎 𝚞𝚜𝚎 𝚠𝚘𝚛𝚜𝚝 ⏳ 🗑️ ~",
            "~ 𝚃𝚑𝚎 𝚏𝚞𝚝𝚞𝚛𝚎 𝚒𝚜 𝚜𝚘𝚖𝚎𝚝𝚑𝚒𝚗𝚐 𝚠𝚑𝚒𝚌𝚑 𝚎𝚟𝚎𝚛𝚢𝚘𝚗𝚎 𝚛𝚎𝚊𝚌𝚑𝚎𝚜 𝚊𝚝 𝚝𝚑𝚎 𝚛𝚊𝚝𝚎 𝚘𝚏 𝚜𝚒𝚡𝚝𝚢 𝚖𝚒𝚗𝚞𝚝𝚎𝚜 𝚊𝚗 𝚑𝚘𝚞𝚛 🚶 🧭 ~",
            "~ 𝙿𝚞𝚗𝚌𝚝𝚞𝚊𝚕𝚒𝚝𝚢 𝚒𝚜 𝚝𝚑𝚎 𝚝𝚑𝚒𝚎𝚏 𝚘𝚏 𝚝𝚒𝚖𝚎 🕵️ 🎩 ~",
            "~ 𝚁𝚎𝚊𝚕𝚒𝚣𝚎 𝚝𝚑𝚊𝚝 𝚗𝚘𝚠, 𝚒𝚗 𝚝𝚑𝚒𝚜 𝚖𝚘𝚖𝚎𝚗𝚝, 𝚝𝚒𝚖𝚎 𝚒𝚜 𝚜𝚝𝚘𝚙𝚙𝚒𝚗𝚐 𝚏𝚘𝚛 𝚗𝚘𝚝𝚑𝚒𝚗𝚐 📍 🏃 ✨ ~",
            "~ 𝚃𝚒𝚖𝚎 𝚜𝚕𝚒𝚙𝚜 𝚊𝚠𝚊𝚢 𝚕𝚒𝚔𝚎 𝚜𝚊𝚗𝚍 𝚝𝚑𝚛𝚘𝚞𝚐𝚑 𝚊𝚗 𝚑𝚘𝚞𝚛𝚐𝚕𝚊𝚜𝚜 🏖️ ⌛ 🌊 ~"
        ];

        let currentQuoteIndex = Math.floor(Math.random() * quotes.length);
        const quoteDisplay = document.getElementById('quoteDisplay');
        quoteDisplay.textContent = quotes[currentQuoteIndex];

        function rotateQuote() {
            quoteDisplay.classList.remove('glitch-in');
            quoteDisplay.classList.add('glitch-out');

            setTimeout(() => {
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
                quoteDisplay.textContent = quotes[currentQuoteIndex];
                quoteDisplay.classList.remove('glitch-out');
                quoteDisplay.classList.add('glitch-in');
            }, 400);
        }

        setInterval(rotateQuote, 6000);

        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let effects = [];
        const numStars = 180;
        const speed = 0.8;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * canvas.width * 2;
                this.y = (Math.random() - 0.5) * canvas.height * 2;
                this.z = Math.random() * canvas.width;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = canvas.width;
                }
            }
            draw() {
                const k = 128 / this.z;
                const px = this.x * k + canvas.width / 2;
                const py = this.y * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(0.1, (1 - this.z / canvas.width) * 2.5);
                    const alpha = Math.min(1, (1 - this.z / canvas.width) * 1.2);

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) stars.push(new Star());
        }

        class Ring {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.life = 1;
                this.color = ['#00f0ff', '#ff007f', '#a855f7'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.radius += 3;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 4 + 1.5;
                this.vx = Math.cos(angle) * spd;
                this.vy = Math.sin(angle) * spd;
                this.size = Math.random() * 3 + 1;
                this.color = ['#ff007f', '#a855f7', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 4)];
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class EduItem {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
                const speed = Math.random() * 7 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.25;
                this.items = ['🎓', '📚', '✏️', '💡', '📐', '📝', '🔬'];
                this.symbol = this.items[Math.floor(Math.random() * this.items.length)];
                this.size = Math.floor(Math.random() * 12) + 20;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.2;
                this.life = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
                this.life -= 0.015;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        function spawnInteraction(x, y) {
            effects.push(new Ring(x, y));
            for (let i = 0; i < 22; i++) {
                effects.push(new Spark(x, y));
            }
        }

        function spawnEduItems(x, y) {
            for (let i = 0; i < 14; i++) {
                effects.push(new EduItem(x, y));
            }
        }

        function animate() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            effects.forEach((e, index) => {
                e.update();
                e.draw();
                if (e.life <= 0) effects.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
