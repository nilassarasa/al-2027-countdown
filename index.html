<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A/L 2027 Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050508;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* --- Ambient Lighting --- */
        .bg-glow {
            position: absolute;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            top: 15%; left: 10%;
            animation: floatGlow 12s infinite alternate ease-in-out;
            z-index: 1;
        }

        .bg-glow-2 {
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 10%; right: 10%;
            animation: floatGlow 15s infinite alternate-reverse ease-in-out;
            z-index: 1;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 60px) scale(1.2); }
        }

        /* --- Floating Cartoon Characters Layer --- */
        .character-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .char {
            position: absolute;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 10px rgba(168, 85, 247, 0.3));
            animation: floatChar 6s ease-in-out infinite alternate;
            user-select: none;
        }

        /* Individual Character Placement & Unique Timings */
        .char-1 { top: 12%; left: 8%;  animation-duration: 5s; animation-delay: 0s; }    /* Books */
        .char-2 { top: 18%; right: 10%; animation-duration: 7s; animation-delay: 1s; }   /* Rocket */
        .char-3 { bottom: 18%; left: 10%; animation-duration: 6s; animation-delay: 2s; }  /* Grad Cap */
        .char-4 { bottom: 15%; right: 12%; animation-duration: 8s; animation-delay: 0.5s; } /* Lightbulb */
        .char-5 { top: 50%; left: 4%; transform: translateY(-50%); animation-duration: 6.5s; animation-delay: 1.5s; } /* Target */
        .char-6 { top: 52%; right: 4%; transform: translateY(-50%); animation-duration: 5.5s; animation-delay: 2.5s; } /* Alarm Clock */

        @keyframes floatChar {
            0% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-20px) rotate(8deg) scale(1.08);
            }
            100% {
                transform: translateY(10px) rotate(-6deg) scale(0.96);
            }
        }

        /* --- Main Content --- */
        .container {
            z-index: 3;
            text-align: center;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Shining Title --- */
        h1 {
            font-size: clamp(1.6rem, 6vw, 3.8rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: clamp(20px, 5vh, 40px);
            background: linear-gradient(90deg, #a855f7, #3b82f6, #ec4899, #a855f7);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite, neonPulse 2.5s ease-in-out infinite alternate;
            text-transform: uppercase;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes neonPulse {
            from { text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
            to { text-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
        }

        /* --- Grid (2x2 Mobile, 1x4 Desktop) --- */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(10px, 3vw, 20px);
            width: 100%;
            max-width: 700px;
        }

        .box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: clamp(12px, 3vw, 20px);
            padding: clamp(15px, 4vw, 25px) 10px;
            text-align: center;
            box-shadow: 0 10px 32px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .box:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: rgba(168, 85, 247, 0.6);
        }

        .number {
            font-size: clamp(1.6rem, 7vw, 4rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            line-height: 1;
        }

        .label {
            font-size: clamp(0.6rem, 2.2vw, 0.95rem);
            color: #94a3b8;
            margin-top: clamp(8px, 2vw, 12px);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .char {
                opacity: 0.6; /* Slight transparency on mobile so it doesn't distract */
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glow Background -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- Floating 3D Animated Cartoon Characters -->
    <div class="character-layer">
        <div class="char char-1">📚</div>
        <div class="char char-2">🚀</div>
        <div class="char char-3">🎓</div>
        <div class="char char-4">💡</div>
        <div class="char char-5">🎯</div>
        <div class="char char-6">⏰</div>
    </div>

    <!-- Main Countdown -->
    <div class="container">
        <h1>2027 A/L Countdown</h1>
        <div class="countdown">
            <div class="box"><div class="number" id="days">00</div><div class="label">Days</div></div>
            <div class="box"><div class="number" id="hours">00</div><div class="label">Hours</div></div>
            <div class="box"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
            <div class="box"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
        </div>
    </div>

    <script>
        const examDate = new Date("August 3, 2027 08:30:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = examDate - now;

            if (difference < 0) {
                clearInterval(timer);
                document.querySelector(".container").innerHTML = "<h1>EXAM HAS STARTED!</h1>";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? '0' + d : d;
            document.getElementById("hours").innerText = h < 10 ? '0' + h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0' + m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0' + s : s;
        }, 1000);
    </script>
</body>
</html>
